<style>
/* Layout: one-column app shell, big tappable cards for iPad; each subject owns a color, the island teal ties them together. */
:root{
  --bg:#EAF2F1; --surface:#FFFFFF; --sunk:#F3F7F6; --ink:#15302E; --muted:#5A7270; --line:#D2E0DD;
  --accent:#0E7C77; --accent-ink:#FFFFFF; --good:#1D9A57; --good-bg:#E2F5EA; --warn:#C77D00; --warn-bg:#FFF2D9; --bad:#D2443F; --bad-bg:#FCE6E4;
  --zh:#D2503F; --ma:#2C79C9; --so:#B98000; --sc:#2A9550; --en:#7656BE; --lock:#9AABA9;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:16px; --shadow:0 1px 0 rgba(21,48,46,.06),0 6px 18px rgba(21,48,46,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1D1C; --surface:#172928; --sunk:#132322; --ink:#E4EFEE; --muted:#9BB1AF; --line:#28403E;
  --accent:#3CB7AF; --accent-ink:#06201E; --good:#4CC983; --good-bg:#14352A; --warn:#F0B341; --warn-bg:#3A2E12; --bad:#F27771; --bad-bg:#3E1C1A;
  --zh:#F07B6B; --ma:#62A6F0; --so:#E2B23F; --sc:#5BC783; --en:#A58BEA; --lock:#5E7472; --shadow:0 1px 0 rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D1C; --surface:#172928; --sunk:#132322; --ink:#E4EFEE; --muted:#9BB1AF; --line:#28403E;
  --accent:#3CB7AF; --accent-ink:#06201E; --good:#4CC983; --good-bg:#14352A; --warn:#F0B341; --warn-bg:#3A2E12; --bad:#F27771; --bad-bg:#3E1C1A;
  --zh:#F07B6B; --ma:#62A6F0; --so:#E2B23F; --sc:#5BC783; --en:#A58BEA; --lock:#5E7472; --shadow:0 1px 0 rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:17px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 90px;-webkit-tap-highlight-color:transparent}
#app{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-none{background:var(--sunk);color:var(--muted)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar .grow{flex:1 1 160px;min-width:0}
.back{min-height:42px;padding:0 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.brand .mark{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:24px;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{min-height:42px;padding:0 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.name{min-height:76px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);font-size:22px;font-weight:700;letter-spacing:.06em}
.name:active{transform:scale(.98)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.subj{position:relative;text-align:left;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:16px;display:grid;gap:10px;min-height:150px;border-top:6px solid var(--sc-c,var(--accent))}
.subj .glyph{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;background:var(--sc-c)}
.subj.locked{border-top-color:var(--lock);opacity:.8}
.subj.locked .glyph{background:var(--lock)}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.unit{display:grid;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.games{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--sc-c,var(--line));color:var(--sc-c,var(--ink));font-weight:600;background:var(--surface)}
.gbtn[disabled]{border-color:var(--line);color:var(--lock)}
.review{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);border:1.5px solid var(--warn)}
.review .num{font-size:32px;font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums}
/* play */
.playhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.prog{flex:1;min-width:120px;height:12px;border-radius:99px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:var(--sc-c,var(--accent));transition:width .3s}
.hearts{font-size:20px;letter-spacing:2px}
.qcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px;display:grid;gap:16px}
.qtext{font-size:22px;font-weight:600}
.model{padding:10px 14px;border-radius:12px;background:var(--sunk);font-size:17px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{min-height:58px;padding:10px 14px;border-radius:14px;background:var(--sunk);border:2px solid var(--line);font-size:20px;text-align:left}
.opt.big{font-size:30px;text-align:center}
.opt.sel{border-color:var(--sc-c,var(--accent));background:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.lane{min-height:64px;padding:10px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lane.col{flex-direction:column;align-items:stretch}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool.col{flex-direction:column}
.chip{min-height:48px;padding:6px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-size:19px;text-align:left;box-shadow:0 2px 0 var(--line)}
.chip.used{visibility:hidden}
.chip .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sc-c,var(--accent));color:#fff;font-size:14px;margin-right:6px}
.hint{font-size:14px;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:8px;align-content:start;min-width:0}
.mitem{min-height:52px;padding:8px 12px;border-radius:12px;background:var(--sunk);border:2px solid var(--line);text-align:left;font-size:17px;display:flex;gap:8px;align-items:center}
.mitem.sel{border-color:var(--sc-c,var(--accent));background:var(--surface)}
.tag{flex:none;min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;padding:0 4px}
.figure{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:16px;align-items:start}
.fig{position:relative;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);max-width:100%}
.fig svg{display:block;width:100%;height:auto}
.spot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px;border:2px solid var(--surface)}
.cls{display:grid;gap:10px}
.clsrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--sunk)}
.clsrow .cbtns{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{min-height:42px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:15px}
.cbtn.on{border-color:var(--sc-c,var(--accent));background:var(--sc-c,var(--accent));color:#fff}
.passage{display:grid;gap:6px;padding:14px;border-radius:14px;background:var(--sunk)}
.sent{text-align:left;padding:6px 10px;border-radius:10px;font-size:19px;border:2px solid transparent}
.sent.on{border-color:var(--sc-c,var(--accent));background:var(--surface)}
.sent.ev{background:var(--good-bg)}
.steps{display:grid;gap:8px}
.step{text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;background:var(--sunk);border:2px solid var(--line);font-size:18px}
.speak{width:96px;height:96px;border-radius:50%;background:var(--sc-c,var(--accent));color:#fff;font-size:40px;justify-self:center}
.fb{border-radius:16px;padding:16px;display:grid;gap:8px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb h3{font-size:22px}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:6px;width:min(400px,100%);aspect-ratio:1;justify-self:center}
.cell{min-width:0;min-height:0;border-radius:10px;background:var(--sunk);border:1.5px solid var(--line);display:grid;place-items:center;font-size:18px;position:relative;max-width:100%}
.cell.me{outline:3px solid var(--sc-c);outline-offset:-3px;background:var(--surface)}
.cell.mid{visibility:hidden}
.die{font-size:34px;font-weight:700;color:var(--sc-c)}
.stars{font-size:42px;letter-spacing:6px;color:var(--warn)}
/* teacher */
.tlock{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:15px;color:var(--muted)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pinpad button{height:60px;border-radius:14px;background:var(--sunk);font-size:24px;font-weight:600}
.dots{display:flex;gap:10px;justify-content:center;font-size:26px;letter-spacing:4px;min-height:36px}
.tbl{overflow-x:auto;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:grid;gap:6px;border-left:6px solid var(--good)}
.lcard.stuck{border-left-color:var(--warn)} .lcard.idle{border-left-color:var(--bad)} .lcard.done{border-left-color:var(--lock)}
.dotrow{display:flex;gap:3px}
.dotrow i{width:12px;height:12px;border-radius:50%;background:var(--good)} .dotrow i.x{background:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.sw{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--good)} .sw.on::after{left:25px}
.note{padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:20;font-size:15px}
.trybar{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
/* home & student hub */
body{background:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),var(--bg)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero{position:relative;border-radius:30px;overflow:hidden;min-height:340px;margin:4px 0 26px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 18px 40px -18px rgba(8,70,95,.55);isolation:isolate}
.scene-svg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:-1}
.hero-card{position:absolute;left:22px;top:22px;max-width:380px;padding:20px 22px;border-radius:22px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);color:#14343A;box-shadow:0 10px 30px -12px rgba(10,60,80,.45);border:1px solid rgba(255,255,255,.8)}
.hero-card .eyebrow{color:#0E7C77}
.hero-title{font-size:44px;letter-spacing:.04em;margin:6px 0 4px;background:linear-gradient(92deg,#0B6F8C,#13A08F 60%,#4FA845);-webkit-background-clip:text;background-clip:text;color:transparent;animation:popin .7s cubic-bezier(.2,1.6,.4,1) both}
.hero-sub{margin:0;font-size:15px;color:#3C5A60}
.hero-stats{display:flex;gap:6px;margin-top:14px}
.hero-stats div{flex:1;background:#fff;border-radius:14px;padding:8px 10px;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.hero-stats b{display:block;font-size:24px;color:#0E7C77;font-variant-numeric:tabular-nums;line-height:1.2}
.hero-stats span{font-size:12px;color:#5A7270}
.scene-mute{position:absolute;right:14px;bottom:14px;min-height:42px;padding:0 14px;border-radius:99px;font-weight:700;font-size:15px;color:#0B6F8C;background:rgba(255,255,255,.85);font-size:20px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.cloud{animation:cloud 40s linear infinite}.cloud.c2{animation-duration:52s;animation-delay:-20s}.cloud.c3{animation-duration:30s;animation-delay:-8s}
.bird{animation:bird 22s linear infinite}
.pin{animation:pinb 2.6s ease-in-out infinite}
.sailboat{animation:sail 18s ease-in-out infinite}
.wave{animation:wave 5s linear infinite}.wave.w2{animation-duration:7s}.wave.w3{animation-duration:9s;animation-direction:reverse}
.spark{animation:spark 2.4s ease-in-out infinite}
.palm{animation:palm 5s ease-in-out infinite}
.pennant{transform-origin:551px 88px;animation:flag 1.6s ease-in-out infinite}
.trail{animation:trail 6s linear infinite}
@keyframes cloud{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
@keyframes bird{0%{transform:translate(-80px,170px)}100%{transform:translate(1080px,120px)}}
@keyframes pinb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sail{0%,100%{transform:translate(70px,338px) rotate(-2deg)}50%{transform:translate(150px,340px) rotate(2deg)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-120px)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1)}}
@keyframes palm{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes flag{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.75)}}
@keyframes trail{to{stroke-dashoffset:-130}}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.sec-h h2{font-size:24px}
.segs{display:flex;gap:6px;padding:6px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto}
.seg{flex:1 0 auto;min-height:48px;padding:0 16px;border-radius:13px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.seg i{font-style:normal;font-size:12px;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);padding:0 6px}
.seg.on{background:linear-gradient(135deg,#13A08F,#0B6F8C);color:#fff;box-shadow:0 6px 14px -6px rgba(11,111,140,.7)}
.seg.on i{background:rgba(255,255,255,.25);color:#fff}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.name{display:flex;align-items:center;gap:14px;min-height:84px;padding:12px 14px;border-radius:20px;background:var(--surface);text-align:left;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .15s,box-shadow .15s;animation:rise .4s both}
.name:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(21,48,46,.35)}
.name:active{transform:scale(.98)}
.name.picked{animation:popin .35s}
.av{position:relative;flex:none;width:58px;height:58px;border-radius:18px;background:var(--av);display:grid;place-items:center;font-size:32px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.07)}
.av.sm{width:38px;height:38px;border-radius:12px;font-size:21px}
.av em{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-style:normal;font-size:13px;display:grid;place-items:center;border:2px solid var(--surface)}
.name:hover .av{animation:bob 1s ease-in-out infinite}
.nm{flex:1;min-width:0;display:grid}
.nm b{font-size:21px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:28px;color:var(--lock);line-height:1}
.side{display:grid;gap:14px}
.panel{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}

/* ---------- sound (synthesized, no files) ---------- */
const SFX=(()=>{
  const PACKS=[['marimba','🎵 木琴'],['bell','🔔 魔法鈴'],['arcade','👾 電玩'],['off','🔇 靜音']];
  let ctx=null,pack='marimba';try{const v=localStorage.getItem('island-sound');if(v&&PACKS.some(p=>p[0]===v))pack=v}catch(e){}
  function ac(){try{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C()}if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}}
  const N=n=>440*Math.pow(2,(n-69)/12); /* midi -> Hz */
  function env(c,g,n,a,d,v){g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+a);g.gain.exponentialRampToValueAtTime(.0001,n+a+d)}
  function out(c){if(!c._bus){const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(c.destination);c._bus=comp}return c._bus}
  function note(m,t0,len,v){if(pack==='off')return;const c=ac();if(!c)return;const n=c.currentTime+t0,f=N(m),bus=out(c);v=v||.2;
    if(pack==='marimba'){[[1,1],[4,.18],[9.2,.05]].forEach(([h,a])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*h;env(c,g,n,.004,(len||.35)/h**.35,v*a);o.connect(g);g.connect(bus);o.start(n);o.stop(n+1.2)})}
    else if(pack==='bell'){const car=c.createOscillator(),mod=c.createOscillator(),mg=c.createGain(),g=c.createGain();car.frequency.value=f;mod.frequency.value=f*3.5;mg.gain.setValueAtTime(f*2.2,n);mg.gain.exponentialRampToValueAtTime(f*.1,n+1);mod.connect(mg);mg.connect(car.frequency);env(c,g,n,.006,(len||.7)*1.6,v*.75);car.connect(g);g.connect(bus);car.start(n);mod.start(n);car.stop(n+2);mod.stop(n+2)}
    else{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(f,n);env(c,g,n,.003,len||.12,v*.35);o.connect(g);g.connect(bus);o.start(n);o.stop(n+(len||.12)+.1)}}
  function glide(m1,m2,t0,len,v){if(pack==='off')return;const c=ac();if(!c)return;const n=c.currentTime+t0;const o=c.createOscillator(),g=c.createGain();o.type=pack==='arcade'?'square':'triangle';o.frequency.setValueAtTime(N(m1),n);o.frequency.exponentialRampToValueAtTime(N(m2),n+len);env(c,g,n,.01,len,(v||.15)*(pack==='arcade'?.4:1));o.connect(g);g.connect(out(c));o.start(n);o.stop(n+len+.1)}
  function noise(t0,len,fq,v){if(pack==='off')return;const c=ac();if(!c)return;const n=c.currentTime+t0;const b=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fq;f.Q.value=3;g.gain.value=v||.5;s.connect(f);f.connect(g);g.connect(out(c));s.start(n)}
  const seq=(ms,step,len,v)=>ms.forEach((m,i)=>note(m,i*step,len,v));
  return {
    get muted(){return pack==='off'},get label(){return PACKS.find(p=>p[0]===pack)[1]},
    cycle(){const i=PACKS.findIndex(p=>p[0]===pack);pack=PACKS[(i+1)%PACKS.length][0];try{localStorage.setItem('island-sound',pack)}catch(e){}this.ok(1)},
    tap(){note(84,0,.08,.08)},
    ok(c){const k=Math.min((c||1)-1,7);seq([72+k,76+k,79+k],.075,.3,.2);if(c>=3)note(84+k,.24,.5,.14)},
    no(){note(64,0,.25,.16);note(60,.14,.4,.16)},
    heart(){glide(67,52,0,.35,.16);noise(.02,.12,900,.15)},
    dice(){for(let i=0;i<6;i++)noise(i*.07,.05,1800+Math.random()*1500,.45);note(79,.46,.25,.14)},
    start(){seq([60,64,67,72,76],.07,.35,.18)},
    win(){seq([72,76,79,84],.1,.35,.2);[79,84,88].forEach((m,i)=>note(m,.42+i*.08,.6,.12));note(91,.75,.9,.12)},
    lose(){seq([67,66,65,64],.17,.4,.13)},
    unlock(){seq([67,72,76,79,84],.08,.55,.17)},
    sticker(){note(88,0,.25,.12);note(93,.08,.4,.12)},
    hello(){seq([72,79],.1,.4,.16)}
  };
})();
function confetti(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const dpr=window.devicePixelRatio||1;const W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;const x=c.getContext('2d');const cols=['#D2503F','#2C79C9','#E2B23F','#2A9550','#7656BE','#3CB7AF','#FF8FB1'];
  const P=Array.from({length:150},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*3*dpr,vy:(2+Math.random()*3)*dpr,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:(7+Math.random()*8)*dpr,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04*dpr;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(t-t0<3200)requestAnimationFrame(f);else c.remove()})(t0)}
const TYPE_NAME={num:'計算',multi:'勾選',write:'寫國字',mc:'選擇',order:'排序',match:'配對',tiles:'詞卡造句',evidence:'閱讀證據',classify:'分類',errstep:'找錯',listen:'聽音',spell:'拼字',label:'圖片標記'};

const openVal=(o,subj,pub,uid)=>{const v=o&&o[ukey(subj,pub,uid)];return subj==='社會'?v!==false:!!v};

/* mastery: ok = consecutive correct; mastered when ok>=2 */
function qStatus(r){if(!r||!r.n)return 'new';if((r.ok||0)>=2)return 'done';if((r.w||0)>=2)return 'weak';return 'learn'}
function unitSummary(sid,subj,pub,un){const m=stuDoc(sid).m||{};let c={new:0,learn:0,weak:0,done:0},n=0,ok=0;un.items.forEach(it=>{const r=m[ukey(subj,pub,un.id)+'|'+it.id];c[qStatus(r)]++;if(r){n+=r.n||0;ok+=(r.n||0)-(r.w||0)}});const tot=un.items.length;const tried=tot-c.new;let st='new';if(tried){if(c.done/tot>=.8)st='done';else if(c.weak>=Math.max(2,tried*.3)||(n>=6&&ok/n<.6))st='weak';else st='learn'}return {c,tot,st,acc:n?ok/n:null,n}}
const ST={new:['尚未開始','p-none'],learn:['還在練','p-warn'],weak:['錯很多','p-bad'],done:['已學會','p-good']};

const savers={};
function save(path,data){if(!S.db)return;let sv=savers[path];if(!sv){sv=savers[path]={pending:null,busy:false};}sv.pending=data;if(!sv.busy)flush(path)}
async function flush(path){const sv=savers[path];sv.busy=true;while(sv.pending){const d=sv.pending;sv.pending=null;try{await S.db.doc(path).set(d)}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));if(!sv.pending)sv.pending=d}else{console.warn('save fail',path,e);if(e&&e.code==='quota_exceeded')toast('雲端空間滿了，請老師清理舊紀錄');break}}}sv.busy=false}
async function initDB(){
  let db=null;try{db=await window.claude?.use?.('db')}catch(e){db=null}
  if(!db){S.dbState='none';S.cfgState='none';render();return}
  S.db=db;S.dbState='ok';
  const timer=setTimeout(()=>{if(S.cfgState==='wait'){S.cfgState='slow';render()}},10000);
  db.doc('cfg/main').onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(timer);S.cfg=snap.exists?JSON.parse(JSON.stringify(snap.data())):null;S.cfgState=snap.exists?'ok':(snap.metadata.fromCache?S.cfgState:'empty');if(S.view.n!=='play')render()},e=>{clearTimeout(timer);S.cfgState='err';render()});
  db.collection('stu').onSnapshot(snap=>{snap.docs.forEach(d=>{S.stu[d.id]=JSON.parse(JSON.stringify(d.data()))});if(S.view.n!=='play')render()},()=>{});
  db.collection('live').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.live=o;if(S.view.n==='teacher'&&S.tTab==='live')render()},()=>{});
}

function Pad(cv,o){o=o||{};const P={cv,color:'#1b2a2a',erase:false,strokes:0,penSeen:false,w:0,h:0};const ctx=cv.getContext('2d');
  P.fit=()=>{const r=cv.getBoundingClientRect();if(!r.width||(Math.round(r.width)===P.w&&Math.round(r.height)===P.h))return;const old=P.strokes?cv.toDataURL():null;const dpr=window.devicePixelRatio||1;P.w=Math.round(r.width);P.h=Math.round(r.height);cv.width=P.w*dpr;cv.height=P.h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,P.w,P.h);im.src=old}};
  P.clear=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();P.strokes=0};
  let down=false,last=null;const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const W=e=>P.erase?(o.eraser||26):(o.width||3)*(e.pointerType==='pen'&&e.pressure?0.55+e.pressure*0.9:1);
  cv.style.touchAction='none';
  cv.addEventListener('pointerdown',e=>{if(e.pointerType==='pen')P.penSeen=true;if(P.penSeen&&e.pointerType==='touch')return;P.fit();down=true;last=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}ctx.globalCompositeOperation=P.erase?'destination-out':'source-over';ctx.fillStyle=P.color;ctx.beginPath();ctx.arc(last[0],last[1],W(e)/2,0,7);ctx.fill();P.strokes++;e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!down)return;if(P.penSeen&&e.pointerType==='touch')return;const pts=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of pts){const q=pt(ev);ctx.globalCompositeOperation=P.erase?'destination-out':'source-over';ctx.strokeStyle=P.color;ctx.lineWidth=W(ev);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();last=q}e.preventDefault()});
  const up=()=>{down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);
  return P}

function charStats(sid,subj,pub,units){const m=stuDoc(sid).m||{};const map=new Map();

  return [...map.values()].map(c=>{const tried=c.rs.filter(r=>r&&r.n);let st='new';if(tried.length){if(tried.some(r=>(r.w||0)>=2&&(r.ok||0)<2)||tried.some(r=>r.w&&!r.ok))st='weak';else if(c.rs.every(r=>r&&(r.ok||0)>=2))st='done';else st='learn'}const w=tried.reduce((a,r)=>a+(r.w||0),0);return {ch:c.ch,zy:c.zy,st,w}})}

  d.m[w.qid]=m;d.days=d.days||{};d.days[ymd()]=(d.days[ymd()]||0)+1;S.stu[s.sid]=d;saveStu(s.sid);
  const id=s.sid+'_'+ymd();const lg=S.logs[id]||(S.logs[id]={sid:s.sid,d:ymd(),a:[]});
  lg.a.push({t:now,q:w.qid,ok:r.ok?1:0,ans:String(r.ans).slice(0,120),md:s.game?s.game.k:s.mode});if(lg.a.length>600)lg.a=lg.a.slice(-600);save('log/'+id,lg);
}

function finish(){

    if(s.game){d.best=d.best||{};const bk=k+'|'+s.game.k;if((d.best[bk]||0)<s.stars)d.best[bk]=s.stars}

async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('arice-island:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of 'arice:'+p)h=(h*31+c.charCodeAt(0))|0;return 'h'+h}}

function tLive(){
  const now=Date.now();const L=Object.values(S.live).filter(x=>now-(x.ts||0)<6*3600e3).sort((a,b)=>(a.done-b.done)||(b.ts-a.ts));

    const state=x.done?'已結束':idle?'沒有回應':stuck?`這題卡了 ${Math.round((now-x.qts)/1000)} 秒`:'作答中';
    return `<div class="lcard ${cls}"><div class="spread"><b style="font-size:18px">${esc(x.name)}</b><span class="pill ${x.done?'p-none':idle?'p-bad':stuck?'p-warn':'p-good'}">${state}</span></div>
    <div class="small">${esc(x.subj)}・${esc(x.pub)}・${esc(x.unit)}</div><div class="small muted">${x.game?esc(x.game):x.mode==='review'?'錯題複習':x.mode==='final'?'總複習':'練習'}・${esc(x.type)}・第 ${x.qi}/${x.qn} 題${x.score!=null?'・'+x.score+' 分':''}</div>

  return `<div class="spread" style="margin-bottom:10px"><span class="small muted">超過 1 分鐘停在同一題會變橘色，5 分鐘沒動靜變紅色。</span><button class="btn ghost sm" data-act="clearLive">清空即時資料</button></div><div class="live">${cards}</div>`;

function subjTotals(sid,subj){const ss=subjState(sid,subj);if(ss.lock)return null;let c={new:0,learn:0,weak:0,done:0},tot=0,n=0,w=0;const m=stuDoc(sid).m||{};ss.units.forEach(u=>{const s=unitSummary(sid,subj,ss.pub,u);tot+=s.tot;for(const k in c)c[k]+=s.c[k];u.items.forEach(it=>{const r=m[ukey(subj,ss.pub,u.id)+'|'+it.id];if(r){n+=r.n;w+=r.w}})});return {c,tot,acc:n?(n-w)/n:null,pub:ss.pub}}
function tProg(){
  if(!students().length)return '<div class="card muted">還沒有學生，請到「設定」新增。</div>';

  return `<p class="small muted">每格：已學會題數／開放題數・答對率；「弱」是錯 2 次以上還沒學會的題數。點學生看詳細。</p><div class="tbl"><table><thead><tr><th>學生</th>${SUBJS.map(s=>`<th>${s}</th>`).join('')}<th>待複習</th><th>最後練習</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function tStu(){

function rightText(it){switch(it.type){case 'num':return it.ans.t==='frac'?it.ans.n+'/'+it.ans.d:it.ans.v+(it.ans.u||'');case 'multi':return it.ans.map(i=>it.items[i]).join('、');case 'write':return it.char+(it.word?'（'+it.word+'）':'');case 'mc':case 'listen':return it.opts[it.a];case 'order':return it.steps.join(' → ');case 'tiles':return /[A-Za-z]/.test(it.tiles.join(''))?it.tiles.join(' '):it.tiles.join('');case 'spell':return it.word;case 'match':return it.pairs.map(p=>p[0]+'→'+p[1]).join('；');case 'label':return it.spots.map(p=>p.a).join('、');case 'classify':return it.items.map(x=>x[0]+'：'+it.cats[x[1]]).join('；');case 'evidence':return it.opts[it.a]+'（第 '+it.ev.map(i=>i+1).join('、')+' 句）';case 'errstep':return '第 '+(it.a+1)+' 步';}return ''}
function tWeak(){
  const combos={};students().forEach(st=>SUBJS.forEach(subj=>{const p=pubOf(st.id,subj);if(p&&unitsOf(subj,p).length)(combos[subj+'|'+p]=combos[subj+'|'+p]||[]).push(st)}));
  const keys=Object.keys(combos);if(!keys.length)return '<div class="card muted">還沒有開放的科目。題庫放進來、在「設定」開放單元後，這裡會列出全班最常錯的題目和技能。</div>';
  return '<div class="stack">'+keys.map(k=>{const [subj,pub]=k.split('|');const sts=combos[k];const us=unitsOf(subj,pub).filter(u=>isOpen(subj,pub,u.id));
    const items={},skills={};us.forEach(u=>u.items.forEach(it=>{const q=ukey(subj,pub,u.id)+'|'+it.id;let wn=0,n=0,who=[];sts.forEach(st=>{const r=(stuDoc(st.id).m||{})[q];if(r){n+=r.n;wn+=r.w;if(r.w&&(r.ok||0)<2)who.push(st.name)}});if(n){items[q]={it,u,wn,n,who};const sk=it.skill||TYPE_NAME[it.type];skills[sk]=skills[sk]||{n:0,w:0};skills[sk].n+=n;skills[sk].w+=wn}}));
    const top=Object.values(items).filter(x=>x.wn).sort((a,b)=>(b.who.length-a.who.length)||(b.wn-a.wn)).slice(0,8);
    const sk=Object.entries(skills).sort((a,b)=>(b[1].w/b[1].n)-(a[1].w/a[1].n)).slice(0,6);
    const ua=us.map(u=>{let n=0,w=0;sts.forEach(st=>{const m=stuDoc(st.id).m||{};u.items.forEach(it=>{const r=m[ukey(subj,pub,u.id)+'|'+it.id];if(r){n+=r.n;w+=r.w}})});return `<span class="pill ${n?((n-w)/n<.6?'p-bad':(n-w)/n<.8?'p-warn':'p-good'):'p-none'}">${esc(u.name)}：${n?Math.round((n-w)/n*100)+'%':'未做'}</span>`}).join(' ');

let curAudio=null;
function ttsFallback(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function say(t){if(!t)return;try{if(curAudio){curAudio.pause();curAudio=null}const a=new Audio('audio/en-'+String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.mp3');curAudio=a;a.onerror=()=>{if(curAudio===a)ttsFallback(t)};const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){ttsFallback(t)}}
function sentText(it){return it.tiles.join(' ').replace(/ ([?.!,])/g,'$1')}

};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.f)return;const d=ensureDraft();const f=el.dataset.f;
  if(f==='stuName'){d.students[+el.dataset.i].name=el.value;return}
  if(f==='schName'){const i=+el.dataset.i;const old=d.schoolOrder[i];const nv=el.value;if(!nv.trim()||(nv!==old&&d.schoolOrder.includes(nv)))return;d.schoolOrder[i]=nv;d.schools[nv]=d.schools[old]||{};if(nv!==old)delete d.schools[old];d.students.forEach(s=>{if(s.school===old)s.school=nv});return}});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.f)return;const d=ensureDraft();const f=el.dataset.f;
  if(f==='pub'){const s=el.dataset.s;d.schools[s]=d.schools[s]||{};if(el.value)d.schools[s][el.dataset.subj]=el.value;else delete d.schools[s][el.dataset.subj];render()}
  else if(f==='stuSchool'){d.students[+el.dataset.i].school=el.value;render()}
  else if(f==='schName'||f==='stuName')render()});
setInterval(()=>{if(S.view.n==='teacher'&&S.tTab==='live'&&!document.activeElement.matches('input,select'))render()},5000);
/* iPad：網頁沒辦法自己切全螢幕，改成說明怎麼從主畫面圖示打開＋引導使用模式 */
var FS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var FS_APP=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
function fsHelp(){let o=document.getElementById('fshelp');if(o){o.remove();return}
  o=document.createElement('div');o.id='fshelp';o.setAttribute('role','dialog');o.setAttribute('aria-label','iPad 全螢幕');
  o.style.cssText='position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:rgba(5,3,8,.72)';
  o.innerHTML='<div style="max-width:440px;width:100%;background:#17111B;color:#F0E6DA;border:1px solid #3A2C38;border-radius:20px;padding:22px 22px 18px;font-size:17px;line-height:1.65;box-shadow:0 20px 60px rgba(0,0,0,.5)">'
   +'<b style="font-size:20px">iPad 要這樣變全螢幕</b>'
   +'<p style="margin:10px 0 0">iPad 不允許網頁自己切成全螢幕，按鈕在平板上沒有作用。請改用：</p>'
   +'<p style="margin:12px 0 0"><b>① 從主畫面的圖示打開</b><br>就是之前安裝描述檔後出現的圖示。從那裡打開，上面不會有網址列和分頁。</p>'
   +'<p style="margin:12px 0 0"><b>② 讓學生跳不出去：引導使用模式</b><br>「設定 → 輔助使用 → 引導使用模式」打開並設密碼。進到遊戲後，連按三下頂端按鈕（有 Home 鍵的按三下 Home 鍵），按「開始」就鎖住了。</p>'
   +'<button type="button" style="margin-top:16px;width:100%;min-height:48px;border-radius:14px;border:0;background:#E2513F;color:#fff;font-size:17px;font-weight:700">知道了</button></div>';
  o.addEventListener('click',e=>{if(e.target===o||e.target.tagName==='BUTTON')o.remove()});document.body.appendChild(o)}
(function(){const b=$('#fsbtn');if(FS_APP){b.hidden=true;b.style.display='none';return}if(FS_IOS){b.onclick=()=>fsHelp();return}const de=document.documentElement;const req=de.requestFullscreen||de.webkitRequestFullscreen;const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const upd=()=>{b.textContent=isFs()?'✕ 離開全螢幕':'⛶ 全螢幕'};
  if(!req){b.hidden=true;return}
  b.onclick=async()=>{try{if(isFs()){await (document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const r=req.call(de);if(r&&r.then)await r}}catch(e){toast('這裡沒辦法全螢幕，請用 iPad 的「引導使用模式」')}setTimeout(upd,200)};
  document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd)})();
render();initDB();
})();
