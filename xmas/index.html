<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>聖誕Q版頭像工坊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: avatar stage on the left (sticky on desktop), stacked option groups on the right; one column on phones */
:root{
  --bg:#eaf1ee; --surface:#ffffff; --line:#d3e0da; --fg:#16302a; --muted:#56706a;
  --holly:#c8323f; --pine:#1f6b4a; --gold:#d9a227;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1916; --surface:#16231f; --line:#29403a; --fg:#e6efeb; --muted:#9db3ab;
  --holly:#ff6b76; --pine:#4fbf8a; --gold:#f0c24f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1916; --surface:#16231f; --line:#29403a; --fg:#e6efeb; --muted:#9db3ab;
  --holly:#ff6b76; --pine:#4fbf8a; --gold:#f0c24f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:22px}
h1{font-size:clamp(26px,4.5vw,36px);font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--holly)}
header p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
@media (max-width:820px){.stage{position:static}}
.frame{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;place-items:center}
.frame svg{width:100%;max-width:380px;height:auto;display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{flex:1 1 140px;border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px}
.btn.primary{background:var(--holly);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:18px}
.group h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);
  color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px;transition:border-color .15s,transform .15s}
.chip:hover{border-color:var(--pine)}
.chip[aria-pressed="true"]{border-color:var(--holly);box-shadow:0 0 0 2px color-mix(in srgb,var(--holly) 25%,transparent)}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.textrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.textrow input[type=text]{flex:1 1 180px;min-width:0;font:inherit;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.hint{font-size:13px;color:var(--muted);margin:0}
.modal{position:fixed;inset:0;background:rgba(6,14,12,.72);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:20px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.sheet img{width:100%;max-width:100%;border-radius:12px}
.sheet .btn{flex:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.back{color:var(--muted);text-decoration:none;font-weight:700}
.back:hover{color:var(--holly)}
:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
</style></head><body>

<div class="wrap">
  <a class="back" href="../">‹ 回 Arice 首頁</a>
  <header>
    <h1>聖誕 <span>Q 版</span>頭像工坊</h1>
    <p>挑帽子、髮型、表情和衣服，做一張專屬的聖誕大頭貼。</p>
  </header>
  <div class="grid">
    <section class="stage" aria-label="頭像預覽">
      <div class="frame" id="frame"></div>
      <div class="actions">
        <button class="btn ghost" id="rand">隨機搭配</button>
        <button class="btn primary" id="export">產生圖片</button>
      </div>
      <p class="hint">按「產生圖片」會做出 1024×1024 的 PNG，手機長按、電腦按右鍵就能存下來。</p>
    </section>
    <section class="panel" id="panel" aria-label="造型選項"></section>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <img id="out" alt="你的聖誕頭像">
    <a class="btn primary" id="dl" download="聖誕頭像.png" style="text-decoration:none;flex:none">下載 PNG</a>
    <p class="hint">也可以：手機長按圖片 →「儲存影像」<br>電腦：在圖片上按右鍵 →「另存圖片」</p>
    <button class="btn ghost" id="close">關閉</button>
  </div>
</div>

<script>
const OPTS = [
  {key:'hat',label:'帽子',opts:[['santa','聖誕老人帽'],['elf','小精靈帽'],['antlers','麋鹿角'],['wreath','花圈'],['muffs','毛毛耳罩'],['none','不戴']]},
  {key:'hair',label:'髮型',opts:[['short','短髮'],['long','長髮'],['buns','雙丸子'],['curly','捲捲頭']]},
  {key:'hairColor',label:'髮色',color:true,opts:[['#2b2220','黑'],['#7a4b2e','棕'],['#e9b949','金'],['#f39bb4','粉'],['#dfe4ea','銀白'],['#4f7fd0','藍']]},
  {key:'skin',label:'膚色',color:true,opts:[['#ffe2cf','白皙'],['#f6c9a6','自然'],['#dca27a','小麥'],['#a86f4c','深棕']]},
  {key:'eyes',label:'眼睛',opts:[['round','圓圓眼'],['happy','笑瞇瞇'],['wink','眨眼'],['star','星星眼']]},
  {key:'mouth',label:'嘴巴',opts:[['smile','微笑'],['open','哇！'],['cat','貓咪嘴']]},
  {key:'outfit',label:'衣服',opts:[['santa','聖誕老人裝'],['sweater','聖誕毛衣'],['deer','麋鹿連帽衫'],['snow','雪人裝']]},
  {key:'item',label:'手上拿',opts:[['cane','拐杖糖'],['gift','禮物盒'],['ginger','薑餅人'],['cocoa','熱可可'],['none','空手']]},
  {key:'bg',label:'背景',color:true,opts:[['snow','雪夜'],['red','聖誕紅'],['pine','松樹綠'],['frost','冰霜藍']]},
  {key:'shape',label:'形狀',opts:[['circle','圓形'],['square','方形']]},
];
const BG_SW = {snow:'#26386b',red:'#b3202c',pine:'#1f5a3d',frost:'#cfe3f2'};
const state = {hat:'santa',hair:'short',hairColor:'#7a4b2e',skin:'#f6c9a6',eyes:'round',mouth:'smile',
  outfit:'santa',item:'cane',bg:'snow',shape:'circle',ribbon:true,text:'Merry Xmas'};

// deterministic sprinkle positions for background patterns
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const DOTS = Array.from({length:46},()=>[rnd()*400,rnd()*400,1.5+rnd()*3.5]);

const shade=(hex,amt)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(v+amt)));return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function background(){
  const b=state.bg;
  if(b==='snow') return `<rect width="400" height="400" fill="url(#gNight)"/>`+
    DOTS.map(([x,y,r])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#fff" opacity="${(.35+r/9).toFixed(2)}"/>`).join('')+
    `<path d="M0 318 Q110 290 210 314 Q310 338 400 304 V400 H0Z" fill="#e9f1ff"/>`;
  if(b==='red') return `<rect width="400" height="400" fill="#b3202c"/>`+
    DOTS.map(([x,y,r])=>star(x,y,r*1.6,'#f2c14e',.55)).join('');
  if(b==='pine') return `<rect width="400" height="400" fill="#1f5a3d"/>`+
    DOTS.map(([x,y,r])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#fff" opacity=".5"/>`).join('');
  return `<rect width="400" height="400" fill="#d6e8f5"/>`+
    DOTS.filter((_,i)=>i%2).map(([x,y,r])=>flake(x,y,r*2.4)).join('');
}
function star(cx,cy,r,fill,op=1){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}
  return `<polygon points="${p.join(' ')}" fill="${fill}" opacity="${op}"/>`}
function flake(x,y,r){let d='';for(let i=0;i<3;i++){const a=i*Math.PI/3,dx=r*Math.cos(a),dy=r*Math.sin(a);d+=`M${(x-dx).toFixed(1)} ${(y-dy).toFixed(1)}L${(x+dx).toFixed(1)} ${(y+dy).toFixed(1)}`}
  return `<path d="${d}" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`}

function backHair(){
  const c=state.hairColor;
  if(state.hair==='long') return `<path d="M96 180 Q80 300 118 336 Q160 350 200 340 Q240 350 282 336 Q320 300 304 180 Z" fill="${c}"/>`;
  if(state.hair==='buns') return `<circle cx="112" cy="112" r="34" fill="${c}"/><circle cx="288" cy="112" r="34" fill="${c}"/>`;
  return '';
}
const OUTFIT_C={santa:'#d62839',sweater:'#2e7d4f',deer:'#8a5a3b',snow:'#f4f7fb'};
function body(){
  const c=OUTFIT_C[state.outfit], s=state.skin;
  let g=`<rect x="184" y="250" width="32" height="30" rx="8" fill="${shade(s,-18)}"/>`+
    `<ellipse cx="130" cy="318" rx="20" ry="36" transform="rotate(22 130 318)" fill="${shade(c,-14)}"/>`+
    `<ellipse cx="270" cy="318" rx="20" ry="36" transform="rotate(-22 270 318)" fill="${shade(c,-14)}"/>`+
    `<path d="M140 270 Q124 330 120 400 L280 400 Q276 330 260 270 Q200 258 140 270 Z" fill="${c}"/>`;
  if(state.outfit==='santa') g+=`<rect x="191" y="272" width="18" height="128" fill="#fff"/>
    <rect x="125" y="336" width="150" height="17" fill="#2b2b2b"/><rect x="188" y="332" width="24" height="25" rx="3" fill="none" stroke="#f2c14e" stroke-width="5"/>
    <ellipse cx="200" cy="274" rx="58" ry="15" fill="#fff"/>`;
  if(state.outfit==='sweater'){let pts=[];for(let x=126,i=0;x<=274;x+=12,i++)pts.push(`${x},${i%2?328:314}`);
    g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>`+
    [150,175,200,225,250].map(x=>`<circle cx="${x}" cy="296" r="5" fill="#e63946"/>`).join('')+
    [150,175,200,225,250].map(x=>`<circle cx="${x}" cy="348" r="5" fill="#f2c14e"/>`).join('')+
    `<rect x="166" y="262" width="68" height="22" rx="10" fill="#256b42"/>`;}
  if(state.outfit==='deer') g+=`<ellipse cx="200" cy="345" rx="42" ry="46" fill="#ecd3ad"/><path d="M146 272 Q200 296 254 272" fill="none" stroke="#6d4329" stroke-width="10" stroke-linecap="round"/>`;
  if(state.outfit==='snow') g+=[305,335,365].map(y=>`<circle cx="200" cy="${y}" r="6" fill="#26303a"/>`).join('')+
    `<rect x="218" y="272" width="22" height="58" rx="9" fill="#d62839"/><rect x="218" y="300" width="22" height="7" fill="#fff"/>
     <rect x="148" y="260" width="104" height="24" rx="12" fill="#d62839"/><rect x="170" y="260" width="8" height="24" fill="#fff"/><rect x="222" y="260" width="8" height="24" fill="#fff"/>`;
  return g;
}
function head(){
  const s=state.skin;
  return `<circle cx="102" cy="198" r="16" fill="${shade(s,-10)}"/><circle cx="298" cy="198" r="16" fill="${shade(s,-10)}"/>
    <ellipse cx="200" cy="185" rx="100" ry="92" fill="${s}"/>`;
}
function frontHair(){
  const c=state.hairColor;
  if(state.hair==='curly'){let g='';const n=11;for(let i=0;i<n;i++){const a=Math.PI+i*Math.PI/(n-1);
      g+=`<circle cx="${(200+96*Math.cos(a)).toFixed(1)}" cy="${(158+70*Math.sin(a)).toFixed(1)}" r="27" fill="${c}"/>`}
    return g+`<circle cx="104" cy="182" r="22" fill="${c}"/><circle cx="296" cy="182" r="22" fill="${c}"/>`+
      `<circle cx="160" cy="130" r="24" fill="${c}"/><circle cx="200" cy="124" r="26" fill="${c}"/><circle cx="240" cy="130" r="24" fill="${c}"/>`;}
  return `<path d="M100 198 C94 120 140 86 200 86 C260 86 306 120 300 198 C292 168 282 152 268 142 C262 160 248 168 234 170 C238 156 234 146 228 140 C218 158 200 166 182 166 C190 156 192 146 190 140 C176 156 156 164 138 160 C142 152 140 145 136 140 C122 152 108 172 100 198 Z" fill="${c}"/>
    <path d="M150 104 Q175 94 200 96" stroke="#fff" stroke-opacity=".35" stroke-width="6" fill="none" stroke-linecap="round"/>`;
}
function eye(x,type){
  if(type==='happy') return `<path d="M${x-14} 204 Q${x} 186 ${x+14} 204" stroke="#2a1f1d" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(type==='star') return star(x,200,17,'#2a1f1d')+`<circle cx="${x-4}" cy="196" r="3.5" fill="#fff"/>`;
  return `<ellipse cx="${x}" cy="200" rx="13" ry="16" fill="#2a1f1d"/><circle cx="${x-4}" cy="194" r="5" fill="#fff"/><circle cx="${x+5}" cy="206" r="2.5" fill="#fff"/>`;
}
function face(){
  let g='';
  if(state.eyes==='wink') g+=eye(160,'round')+eye(240,'happy'); else g+=eye(160,state.eyes)+eye(240,state.eyes);
  g+=`<ellipse cx="140" cy="228" rx="16" ry="9" fill="#ff7a8a" opacity=".45"/><ellipse cx="260" cy="228" rx="16" ry="9" fill="#ff7a8a" opacity=".45"/>`;
  if(state.hat==='antlers') g+=`<circle cx="200" cy="220" r="10" fill="#e63946"/><circle cx="197" cy="217" r="3" fill="#fff" opacity=".7"/>`;
  if(state.mouth==='smile') g+=`<path d="M187 232 Q200 245 213 232" stroke="#6b2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(state.mouth==='open') g+=`<path d="M186 230 Q200 230 214 230 Q212 252 200 252 Q188 252 186 230 Z" fill="#7a2d33"/><ellipse cx="200" cy="246" rx="7" ry="4" fill="#ff8c98"/>`;
  if(state.mouth==='cat') g+=`<path d="M184 230 Q192 240 200 231 Q208 240 216 230" stroke="#6b2a2a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  return g;
}
function hat(){
  switch(state.hat){
    case 'santa': return `<path d="M106 130 C110 62 168 30 238 38 C300 46 336 98 344 166 L322 170 C316 128 298 102 274 94 C290 108 296 118 294 130 Z" fill="#d62839"/>
      <path d="M150 70 C180 50 220 46 250 54" stroke="#fff" stroke-opacity=".25" stroke-width="8" fill="none" stroke-linecap="round"/>
      <rect x="94" y="116" width="212" height="36" rx="18" fill="#fff"/><circle cx="334" cy="178" r="21" fill="#fff"/>`;
    case 'elf': return `<path d="M104 128 Q170 92 194 14 Q204 -2 222 6 Q214 64 296 128 Z" fill="#2e9e5b"/>
      <circle cx="210" cy="10" r="11" fill="#f2c14e"/><circle cx="210" cy="13" r="3" fill="#8a6414"/>
      <path d="M98 118 L302 118 L302 144 L98 144 Z" fill="#d62839"/>`+
      [110,140,170,200,230,260,290].map(x=>`<path d="M${x-10} 144 L${x} 158 L${x+10} 144 Z" fill="#d62839"/>`).join('');
    case 'antlers': { const a=`<path d="M146 108 C136 80 126 58 104 36 M120 66 C104 68 90 62 80 50 M130 84 C114 92 100 90 88 84" stroke="#7a4a2a" stroke-width="11" fill="none" stroke-linecap="round"/>
      <ellipse cx="118" cy="122" rx="16" ry="10" transform="rotate(-30 118 122)" fill="#8a5a3b"/>`;
      return a+`<g transform="translate(400 0) scale(-1 1)">${a}</g>`; }
    case 'wreath': { let g='';const n=15;for(let i=0;i<n;i++){const t=Math.PI+i*Math.PI/(n-1);const x=200+104*Math.cos(t),y=146+62*Math.sin(t);
        g+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="16" ry="10" transform="rotate(${(t*180/Math.PI+90+(i%2?25:-25)).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${i%2?'#2e7d4f':'#3fa266'}"/>`}
      for(let i=1;i<n;i+=3){const t=Math.PI+i*Math.PI/(n-1);g+=`<circle cx="${(200+100*Math.cos(t)).toFixed(1)}" cy="${(140+58*Math.sin(t)).toFixed(1)}" r="6" fill="#e63946"/>`}
      return g+`<path d="M200 80 l-14 -10 q-6 10 4 16 z M200 80 l14 -10 q6 10 -4 16 z" fill="#e63946"/>`; }
    case 'muffs': return `<path d="M100 186 C92 64 308 64 300 186" stroke="#e6556f" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="98" cy="196" r="28" fill="#fff"/><circle cx="98" cy="196" r="15" fill="#ffc2cd"/>
      <circle cx="302" cy="196" r="28" fill="#fff"/><circle cx="302" cy="196" r="15" fill="#ffc2cd"/>`;
    default: return '';
  }
}
function item(){
  switch(state.item){
    case 'cane': { const d='M292 398 L292 300 Q292 274 314 274 Q336 274 336 296';
      return `<path d="${d}" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#d62839" stroke-width="13" fill="none" stroke-dasharray="9 9"/>`; }
    case 'gift': return `<rect x="270" y="328" width="62" height="52" rx="4" fill="#2e7d4f"/><rect x="296" y="328" width="10" height="52" fill="#f2c14e"/>
      <rect x="270" y="348" width="62" height="10" fill="#f2c14e"/><ellipse cx="291" cy="322" rx="11" ry="7" transform="rotate(-25 291 322)" fill="#f2c14e"/><ellipse cx="311" cy="322" rx="11" ry="7" transform="rotate(25 311 322)" fill="#f2c14e"/>`;
    case 'ginger': return `<g fill="#b8743a"><circle cx="312" cy="314" r="15"/><ellipse cx="312" cy="342" rx="16" ry="20"/><ellipse cx="312" cy="334" rx="28" ry="8"/>
      <ellipse cx="303" cy="362" rx="7" ry="13" transform="rotate(15 303 362)"/><ellipse cx="321" cy="362" rx="7" ry="13" transform="rotate(-15 321 362)"/></g>
      <circle cx="307" cy="311" r="2.2" fill="#fff"/><circle cx="317" cy="311" r="2.2" fill="#fff"/><path d="M307 319 Q312 323 317 319" stroke="#fff" stroke-width="2" fill="none"/>
      <circle cx="312" cy="338" r="2.6" fill="#e63946"/><circle cx="312" cy="348" r="2.6" fill="#2e9e5b"/>`;
    case 'cocoa': return `<path d="M300 306 q-6 -8 0 -16 M314 306 q-6 -8 0 -16" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
      <circle cx="330" cy="352" r="12" fill="none" stroke="#e85d75" stroke-width="7"/><rect x="284" y="326" width="46" height="52" rx="9" fill="#e85d75"/>
      <ellipse cx="307" cy="328" rx="21" ry="6" fill="#6b3e26"/><rect x="298" y="321" width="9" height="8" rx="2" fill="#fff"/><rect x="309" y="323" width="8" height="7" rx="2" fill="#fff"/>
      <rect x="290" y="346" width="34" height="5" fill="#fff" opacity=".6"/>`;
    default: return '';
  }
}
function hands(){const s=state.skin;return `<circle cx="118" cy="350" r="14" fill="${s}"/><circle cx="284" cy="350" r="14" fill="${s}"/>`}
function ribbon(){
  if(!state.ribbon||!state.text.trim()) return '';
  return `<path d="M56 348 H344 L328 370 L344 392 H56 L72 370 Z" fill="#f2c14e"/><path d="M56 348 H344" stroke="#fff" stroke-opacity=".4" stroke-width="3"/>
    <text x="200" y="379" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,Microsoft JhengHei,Arial,sans-serif" font-weight="900" font-size="24" fill="#7a1f2b">${esc(state.text.trim().slice(0,16))}</text>`;
}
function svg(){
  const clip=state.shape==='circle'?'<circle cx="200" cy="200" r="200"/>':'<rect width="400" height="400" rx="36"/>';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="聖誕Q版頭像">
  <defs><linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18234a"/><stop offset="1" stop-color="#3a5394"/></linearGradient>
  <clipPath id="clip">${clip}</clipPath></defs>
  <g clip-path="url(#clip)">${background()}${backHair()}${body()}${head()}${frontHair()}${face()}${hat()}${item()}${hands()}${ribbon()}</g></svg>`;
}

const frame=document.getElementById('frame'), panel=document.getElementById('panel');
function render(){ frame.innerHTML=svg();
  panel.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',state[b.dataset.k]===b.dataset.v)); }

OPTS.forEach(g=>{
  const sec=document.createElement('div');sec.className='group';
  sec.innerHTML=`<h2>${g.label}</h2><div class="chips"></div>`;
  const box=sec.querySelector('.chips');
  g.opts.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip';b.dataset.k=g.key;b.dataset.v=v;b.type='button';
    const sw=g.key==='bg'?BG_SW[v]:(g.color?v:null);
    b.innerHTML=(sw?`<span class="sw" style="background:${sw}"></span>`:'')+l;
    b.onclick=()=>{state[g.key]=v;render()};box.appendChild(b)});
  panel.appendChild(sec);
});
const tg=document.createElement('div');tg.className='group';
tg.innerHTML=`<h2>彩帶文字</h2><div class="textrow"><input type="text" id="txt" maxlength="16" aria-label="彩帶文字">
  <button class="chip" type="button" id="rib"></button></div><p class="hint">可以寫名字或祝福語，最多 16 個字。</p>`;
panel.appendChild(tg);
const txt=tg.querySelector('#txt'), rib=tg.querySelector('#rib');
txt.value=state.text;
const syncRib=()=>{rib.textContent=state.ribbon?'顯示中':'已隱藏';rib.setAttribute('aria-pressed',state.ribbon)};
txt.oninput=()=>{state.text=txt.value;render()};
rib.onclick=()=>{state.ribbon=!state.ribbon;syncRib();render()};
syncRib();

document.getElementById('rand').onclick=()=>{
  OPTS.forEach(g=>{if(g.key==='shape')return;const o=g.opts[Math.floor(Math.random()*g.opts.length)];state[g.key]=o[0]});render()};

const modal=document.getElementById('modal'), out=document.getElementById('out');
document.getElementById('export').onclick=()=>{
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1024;
    c.getContext('2d').drawImage(img,0,0,1024,1024);out.src=c.toDataURL('image/png');document.getElementById('dl').href=out.src;modal.hidden=false};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg());
};
document.getElementById('close').onclick=()=>{modal.hidden=true};
modal.onclick=e=>{if(e.target===modal)modal.hidden=true};
render();
</script>
</body></html>
