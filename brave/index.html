</head><body>
<title>勇者衝鋒</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 勇者衝鋒 hub: a night dungeon. One dark palette on purpose (same in both system modes). */
:root{
  --bg:#0B0710; --surface:#17111B; --sunk:#110C15; --ink:#F0E6DA; --muted:#A8998F; --line:#30252F;
  --accent:#D9443A; --good:#5FD08A; --good-bg:#12291D; --warn:#F0B341; --warn-bg:#33270F; --bad:#FF6B5E; --bad-bg:#3A1416;
  --zh:#E8574B; --ma:#4C8DF0; --so:#E0A23A; --sc:#4CC27A; --en:#A877F0; --lock:#4E4350;
  --p0:#FF8A4A; --p1:#5CC8FF;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; --serif:"Noto Serif TC","Songti TC",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0710;--surface:#17111B;--ink:#F0E6DA}}
:root[data-theme="dark"]{--bg:#0B0710;--surface:#17111B;--ink:#F0E6DA}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(900px 440px at 50% -120px,rgba(170,24,32,.30),transparent 70%),radial-gradient(700px 500px at 110% 110%,rgba(80,20,70,.22),transparent 70%),var(--bg);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%)}
#app{position:relative;z-index:1;max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #FF8A5A;outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1,h2,.serif{font-family:var(--serif);font-weight:900;letter-spacing:.06em}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;color:#fff;background:linear-gradient(180deg,#E2513F,#A3201C);box-shadow:0 3px 0 #5A0E12,0 0 18px -6px rgba(255,80,50,.6)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5A0E12}
.btn.gold{background:linear-gradient(180deg,#FFD76A,#C27A00);color:#2A1600;box-shadow:0 3px 0 #6A3E00,0 0 20px -4px rgba(255,190,60,.7)}
.btn.ghost{background:var(--sunk);border:1.5px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:linear-gradient(180deg,#1A131D,#151018);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;color:#FF9466}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#F0E6DA;color:#1A0E10;padding:10px 18px;border-radius:12px;z-index:60;font-size:15px;font-weight:600;max-width:90vw;text-align:center}
.tlock{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;min-height:40px;padding:0 14px;border-radius:999px;background:rgba(23,17,27,.92);border:1px solid var(--line);font-size:15px;color:var(--muted)}
.fsbtn{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:16;min-height:38px;padding:0 14px;border-radius:999px;background:rgba(23,17,27,.92);border:1px solid var(--line);font-size:14px;color:var(--muted)}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:390px;margin:4px 0 26px;isolation:isolate;box-shadow:0 0 0 1px rgba(255,130,90,.14),0 34px 70px -34px rgba(220,30,30,.65)}
.scene-svg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:-1}
.hero-card{position:absolute;left:22px;top:22px;max-width:390px;padding:20px 22px;border-radius:22px;background:rgba(12,6,12,.62);border:1px solid rgba(255,140,100,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 40px -18px rgba(0,0,0,.9)}
.hero-title{font-family:var(--serif);font-weight:900;font-size:56px;letter-spacing:.14em;margin:6px 0 4px;background:linear-gradient(180deg,#FFF0DC 0%,#FFAE6E 40%,#D2241C 78%,#7A0D12 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,60,30,.5)) drop-shadow(0 3px 0 rgba(0,0,0,.6));animation:popin .7s cubic-bezier(.2,1.6,.4,1) both,flick 5s 1s infinite}
.hero-sub{margin:0;font-size:15px;color:#CDB9AB}
.hero-stats{display:flex;gap:6px;margin-top:14px}
.hero-stats div{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,150,110,.14);border-radius:14px;padding:8px 10px;text-align:center}
.hero-stats b{display:block;font-size:24px;color:#FFB070;font-variant-numeric:tabular-nums;line-height:1.2}
.hero-stats span{font-size:12px;color:var(--muted)}
.scene-mute{position:absolute;right:14px;bottom:14px;min-height:42px;padding:0 14px;border-radius:99px;font-weight:700;font-size:17px;background:rgba(18,8,14,.8);color:#FFD9B0;border:1px solid rgba(255,140,100,.3)}
.scene-svg .star{animation:twinkle 3.2s ease-in-out infinite}
.scene-svg .moon{animation:moonp 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene-svg .cloudd{animation:cdrift 26s ease-in-out infinite alternate}
.scene-svg .bat{animation:batfly 16s linear infinite}
.scene-svg .wing{animation:flap .28s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.scene-svg .fog{animation:fog 18s ease-in-out infinite alternate}
.scene-svg .fog.f2{animation-duration:24s;animation-direction:alternate-reverse}
.scene-svg .fog.f3{animation-duration:30s}
.scene-svg .win{animation:winf 3.6s steps(1) infinite}
.scene-svg .torch{animation:torch .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.scene-svg .flame{animation:flame .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.scene-svg .flag{animation:flagw 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
.scene-svg .rune{animation:pinb 3s ease-in-out infinite}
.scene-svg .eyes{opacity:0;animation:eyes 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene-svg .trail{animation:trail 7s linear infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes moonp{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.03);filter:brightness(1.15)}}
@keyframes cdrift{from{transform:translateX(-40px)}to{transform:translateX(50px)}}
@keyframes batfly{0%{transform:translate(-120px,150px)}50%{transform:translate(500px,70px)}100%{transform:translate(1120px,120px)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
@keyframes fog{from{transform:translateX(-70px)}to{transform:translateX(70px)}}
@keyframes winf{0%{opacity:1}43%{opacity:.35}47%{opacity:1}71%{opacity:.6}74%{opacity:1}}
@keyframes torch{from{opacity:.65;transform:scale(.9)}to{opacity:1;transform:scale(1.12)}}
@keyframes flame{from{transform:scaleY(.8) skewX(-6deg)}to{transform:scaleY(1.2) skewX(6deg)}}
@keyframes flagw{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.72)}}
@keyframes eyes{0%,30%{opacity:0;transform:scaleY(1)}36%{opacity:1}52%{opacity:1;transform:scaleY(1)}54%{transform:scaleY(.08)}56%{transform:scaleY(1)}70%{opacity:1}78%,100%{opacity:0}}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.75}97%{opacity:1}}
@keyframes pinb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes trail{to{stroke-dashoffset:-130}}
@keyframes popin{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px -2px color-mix(in srgb,var(--sc-c) 50%,transparent)}50%{box-shadow:0 0 24px 0 color-mix(in srgb,var(--sc-c) 85%,transparent)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
/* home */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.sec-h h2{font-size:24px}
.segs{display:flex;gap:6px;padding:6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.seg{flex:1 0 auto;min-height:48px;padding:0 16px;border-radius:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.seg i{font-style:normal;font-size:12px;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;background:var(--sunk);padding:0 6px}
.seg.on{background:linear-gradient(180deg,#C93A2C,#7E1216);color:#fff;box-shadow:0 0 0 1px rgba(255,120,80,.35),0 8px 20px -8px rgba(255,60,30,.7)}
.seg.on i{background:rgba(255,255,255,.25);color:#fff}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.name{display:flex;align-items:center;gap:14px;min-height:80px;padding:12px 14px;border-radius:20px;text-align:left;background:linear-gradient(180deg,#1D1520,#140E17);border:1px solid var(--line);animation:rise .4s both;transition:transform .15s,box-shadow .15s}
.name:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,120,80,.4),0 14px 30px -12px rgba(255,60,30,.5)}
.av{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 50% 35%,#3A2430,#1A0F16);border:1.5px solid rgba(255,140,100,.25)}
.av.sm{width:36px;height:36px;border-radius:11px;font-size:20px}
.av.big{width:84px;height:84px;border-radius:26px;font-size:50px}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:21px;letter-spacing:.08em}.nm small{font-size:13px;color:var(--muted)}
.chev{font-size:28px;color:var(--lock)}
.side{display:grid;gap:14px}
.tip{background:linear-gradient(160deg,#2A1012,#151018);border-color:#4A1C1C}
.tip b{color:#FFB070}
.tip ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted);display:grid;gap:4px}
/* student hall */
.me{position:relative;overflow:hidden;border-radius:28px;padding:22px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:4px 0 18px;
  background:radial-gradient(400px 240px at 90% 0%,rgba(229,65,46,.45),transparent 70%),linear-gradient(135deg,#240910 0%,#3A0D16 50%,#160A1C 100%);border:1px solid rgba(255,120,80,.2);box-shadow:0 24px 50px -24px rgba(200,30,30,.6)}
.me .av.big{cursor:pointer;animation:bob 3s ease-in-out infinite;box-shadow:0 0 0 4px rgba(255,140,100,.3),0 0 30px -4px rgba(255,80,50,.6)}
.me-t{flex:1;min-width:200px}.me-t h1{font-size:32px;margin:4px 0 2px}.me-t p{margin:0;color:#E6CFC0}
.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.gate{--sc-c:var(--accent);position:relative;overflow:hidden;text-align:left;color:var(--ink);display:grid;grid-template-rows:auto 1fr auto;gap:10px;
  border-radius:90px 90px 18px 18px/64px 64px 18px 18px;padding:30px 18px 18px;min-height:230px;animation:rise .45s both;transition:transform .18s;
  background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--sc-c) 34%,transparent),transparent 70%),repeating-linear-gradient(0deg,transparent 0 38px,rgba(0,0,0,.25) 38px 40px),linear-gradient(180deg,#221A24,#130D15);
  border:1px solid color-mix(in srgb,var(--sc-c) 50%,#000);box-shadow:inset 0 0 0 4px #0B0710,inset 0 0 0 5px color-mix(in srgb,var(--sc-c) 35%,transparent),inset 0 -30px 50px -20px color-mix(in srgb,var(--sc-c) 30%,transparent),0 18px 36px -20px color-mix(in srgb,var(--sc-c) 70%,#000)}
.gate:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 4px #0B0710,inset 0 0 0 5px color-mix(in srgb,var(--sc-c) 60%,transparent),inset 0 -30px 60px -16px color-mix(in srgb,var(--sc-c) 45%,transparent),0 0 34px -6px color-mix(in srgb,var(--sc-c) 70%,transparent)}
.gate .wm{position:absolute;right:-14px;bottom:-34px;font-size:150px;font-weight:900;font-family:var(--serif);line-height:1;color:color-mix(in srgb,var(--sc-c) 8%,transparent);pointer-events:none}
.gate .glyph{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;font-weight:900;font-family:var(--serif);background:#0B0710;color:var(--sc-c);border:2px solid var(--sc-c);animation:glow 2.6s ease-in-out infinite}
.gate h3{font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.06em}
.gate small{color:var(--muted);font-size:14px}
.gate .go{justify-self:end;padding:4px 12px;border-radius:99px;background:var(--sc-c);color:#fff;font-weight:700;font-size:14px;box-shadow:0 0 14px -2px var(--sc-c)}
.gate.locked{color:#6E6270;background:repeating-linear-gradient(0deg,transparent 0 38px,rgba(0,0,0,.3) 38px 40px),linear-gradient(180deg,#1A151B,#0E0A0F);border-color:#2A222B;box-shadow:inset 0 0 0 4px #0B0710,inset 0 0 0 5px #2A222B}
.gate.locked .glyph{color:#5E5260;border-color:#3A3040;animation:none}
.gate.locked::after{content:"";position:absolute;left:50%;top:74%;width:120%;height:6px;transform:translateX(-50%) rotate(-14deg);background:repeating-linear-gradient(90deg,#4A4048 0 10px,#2A222B 10px 14px);border-radius:3px;opacity:.8}
.z-zh{--sc-c:var(--zh)} .z-ma{--sc-c:var(--ma)} .z-so{--sc-c:var(--so)} .z-sc{--sc-c:var(--sc)} .z-en{--sc-c:var(--en)}
.arena{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin:22px 0 8px;padding:22px 24px;border-radius:24px;text-align:left;width:100%;
  background:radial-gradient(60% 140% at 0% 50%,rgba(240,179,65,.28),transparent 70%),radial-gradient(60% 140% at 100% 50%,rgba(92,200,255,.18),transparent 70%),linear-gradient(120deg,#2A1A08,#170F14 60%,#0E1420);border:1px solid #8A5A12;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 20px 40px -24px rgba(255,170,40,.7)}
.arena .ic{font-size:58px;filter:drop-shadow(0 0 18px rgba(255,170,40,.7));animation:pulse 2.2s ease-in-out infinite}
.arena h3{font-family:var(--serif);font-weight:900;font-size:28px;letter-spacing:.08em;color:#FFD76A}
.arena p{margin:2px 0 0;color:#E6CFC0;font-size:15px}
.arena .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.arena .tags span{font-size:13px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
/* game frame */
.gbar{position:fixed;left:0;right:0;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,#1A0F16,#120A10);border-bottom:1px solid #3A1C22;box-shadow:0 6px 20px -8px rgba(0,0,0,.8)}
.gbar .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .t small{color:var(--muted);font-weight:400;margin-left:8px}
.gframe{position:fixed;left:0;right:0;top:52px;bottom:0;width:100%;height:calc(100% - 52px);border:0;z-index:19;background:#0B0710}
.gload{position:fixed;inset:52px 0 0 0;z-index:21;display:grid;place-items:center;text-align:center;background:#0B0710}
.gload .door{font-size:72px;animation:pulse 1.2s ease-in-out infinite}
body.ingame{overflow:hidden}
body.ingame .tlock,body.ingame .fsbtn{display:none}
/* modal / pin */
.modal{position:fixed;inset:0;z-index:40;background:rgba(4,2,6,.72);display:grid;place-items:center;padding:16px}
.sheet{background:linear-gradient(180deg,#1C1520,#151018);border:1px solid var(--line);border-radius:26px;padding:20px;width:min(720px,100%);max-height:88vh;overflow:auto;display:grid;gap:12px;animation:popin .3s cubic-bezier(.2,1.4,.4,1)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.avc{height:60px;border-radius:16px;font-size:32px;background:var(--sunk);border:2px solid transparent}
.avc.on{border-color:#FF8A5A;box-shadow:0 0 14px -2px #FF6A3A}
.pinbox{max-width:400px;margin:20px auto;text-align:center;display:grid;gap:10px;justify-items:center}
.pinbox.fx-no{animation:shake .42s}
.pdots{display:flex;gap:14px;margin:6px 0}
.pdots i{width:18px;height:18px;border-radius:50%;border:2.5px solid #FF8A5A}
.pdots i.on{background:#FF8A5A;box-shadow:0 0 10px #FF6A3A}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;justify-content:center}
.pinpad button{height:62px;border-radius:14px;background:#0F0B12;border:1px solid var(--line);font-size:24px;font-weight:700}
/* teacher */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.tab{min-height:42px;padding:0 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.tab.on{background:linear-gradient(180deg,#E2513F,#A3201C);border-color:#A3201C;color:#fff}
.tbl{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gl{display:grid;gap:4px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sc-c)}
.gl b{font-size:18px}
.livec{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
@media (max-width:820px){.home-grid{grid-template-columns:1fr}}
@media (max-width:620px){.hero{min-height:0;display:grid}.hero .scene-svg{position:relative;height:210px;z-index:0}.hero-card{position:relative;left:auto;top:auto;max-width:none;margin:-34px 12px 12px;background:var(--surface)}.hero-title{font-size:42px}.scene-mute{left:12px;right:auto;top:12px;bottom:auto}

<script>
(function(){
'use strict';
const SFX=(()=>{
  const PACKS=[['crypt','🕯️ 地城'],['bell','🔔 魔法鈴'],['arcade','👾 電玩'],['marimba','🎵 木琴'],['off','🔇 靜音']];

/* games call this through their BR bridge: each game gets its own corner of the shared database */
/* Objects coming from the game frame are copied into this page's own realm before they reach the

const BRC=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));

let brLogN=0;function brLog(ns,ev,extra){if(!S.db||brLogN>40)return;brLogN++;const id=Date.now()+'_'+Math.random().toString(36).slice(2,6);
  try{S.db.doc('brlog/'+id).set(Object.assign({at:Date.now(),ns,ev,who:window.__brWho||'',ua:navigator.userAgent.slice(0,120)},BRC(extra||{}))).catch(()=>{})}catch(e){}}
function brTry(ns,op,path,fn){let r;try{r=fn()}catch(e){brLog(ns,'err',{op,path,msg:String(e&&(e.message||e.code)||e).slice(0,300)});throw e}
  if(r&&typeof r.then==='function')return r.then(x=>x,e=>{brLog(ns,'err',{op,path,msg:String(e&&(e.message||e.code)||e).slice(0,300)});throw e});return r}
function brQ(ns,path,q){return {
  where:(...a)=>brQ(ns,path,q.where(...a.map(BRC))),orderBy:(...a)=>brQ(ns,path,q.orderBy(...a.map(BRC))),limit:n=>brQ(ns,path,q.limit(+n)),
  get:()=>brTry(ns,'get',path,()=>q.get()),onSnapshot:(n,e)=>q.onSnapshot(n,x=>{brLog(ns,'snaperr',{path,msg:String(x&&(x.message||x.code)||x).slice(0,300)});if(e)e(x)})}}
function brD(ns,path,d){return {id:d.id,path,
  get:()=>brTry(ns,'get',path,()=>d.get()),
  set:(x,o)=>brTry(ns,'set',path,()=>o===undefined?d.set(BRC(x)):d.set(BRC(x),BRC(o))),
  update:x=>brTry(ns,'update',path,()=>d.update(BRC(x))),
  delete:()=>brTry(ns,'delete',path,()=>d.delete()),
  onSnapshot:(n,e)=>d.onSnapshot(n,x=>{brLog(ns,'snaperr',{path,msg:String(x&&(x.message||x.code)||x).slice(0,300)});if(e)e(x)})}}
function brC(ns,path,c){return Object.assign(brQ(ns,path,c),{id:c.id,
  doc:id=>{const ref=id===undefined?c.doc():c.doc(String(id));return brD(ns,path+'/'+ref.id,ref)},
  add:x=>brTry(ns,'add',path,async()=>{const r=await c.add(BRC(x));return r&&r.id!==undefined?brD(ns,path+'/'+r.id,r):r})})}
window.__brUse=async function(name,ns){
  let r=null;try{r=await claude.use(name)}catch(e){r=null}
  if(name==='db'){if(!r){brLog(ns,'nodb');return null}
    const P=p=>ns+'_'+String(p).replace(/^\/+/,'');

    const db=await claude.use('db').catch(()=>null);let own=false,edit=false;

  if(name==='sample'&&r){const f=(i,o)=>r(BRC(i),BRO(o));f.json=(i,o)=>r.json(BRC(i),BRO(o));f.limits=()=>r.limits?r.limits():Promise.resolve({});return f}

/* ---------- host: room lifecycle ---------- */
function pInit(m){return {name:m.name,sid:m.sid,av:m.av,school:m.school,pub:m.pub||'',units:(m.units||[]).slice(),pos:0,score:0,items:[],shop:0,boss:null,stuck:0,dbl:false,frozenUntil:0,freezeNext:false,ok:0,n:0,streak:0,best:0,wrong:[]}}
async function create(){const s=C.setup;const used=new Set(S.duels.filter(d=>d.status!=='end'&&Date.now()-(d.at||0)<3*3600e3).map(d=>d.id));let code;do{code=String(1000+rnd(9000))}while(used.has(code));
  C.code=code;C.role='h';
  if(s.mixed)Object.assign(C.me,{pub:s.pub,units:s.units.slice()});else{delete C.me.pub;delete C.me.units}
  C.R={code,at:Date.now(),status:'wait',subj:s.subj,pub:s.pub,mixed:!!s.mixed,units:s.units.slice(),mins:s.mins,P:[pInit(C.me),null],land:{},r:null,ev:null,log:[],flash:null,startAt:0,endAt:0};
  try{await db().doc('duelin/'+code).delete().catch(()=>{});await db().doc('duel/'+code).set(Object.assign({},C.R,{hostNow:Date.now()}))}catch(e){toast('建立房間失敗，請再試一次');return}
  C.unsub.push(db().doc('duelin/'+code).onSnapshot(sn=>{if(!sn.exists)return;const d=sn.data();if(!C.R)return;
    if(!C.R.P[1]&&C.R.status==='wait'&&d.name&&(!C.R.mixed||(d.pub&&(d.units||[]).length))){C.R.P[1]=pInit(d);SFX.hello();push();render();toast(d.name+' 加入了！')}
    (d.acts||[]).forEach(a=>{if(a.s>C.lastSeq){C.lastSeq=a.s;applyAct(1,a)}});push()},()=>{}));
  C.phase='wait';SFX.door();render();
  C.tick=setInterval(hostTick,250);
}
function startGame(){const R=C.R;if(!R.P[1])return;
  if(R.mixed)C.pools=[0,1].map(i=>poolOf(R.subj,R.P[i].pub,R.P[i].units));else{const items=poolOf(R.subj,R.pub,R.units);C.pools=[items,items]}
  C.decks=C.pools.map(x=>shuffle(x));const now=Date.now();R.status='play';R.startAt=now+START_MS;R.endAt=R.startAt+R.mins*60000;R.log=['決鬥開始！'];C.phase='play';push();SFX.start()}
function hostTick(){const R=C.R;if(!R||R.status!=='play')return tickUI();const now=Date.now();
  if(!R.r){if(now>=R.startAt)nextRound();}
  else if(!R.r.done){const need=R.P.filter(Boolean).length;const got=R.r.ans.filter(Boolean).length;if(got>=need||now-R.r.at>Q_MS)resolve()}
  else if(now-R.r.doneAt>RES_MS){if(now>=R.endAt)finish();else nextRound()}
  tickUI()}
function drawQ(i){if(!C.decks[i].length)C.decks[i]=shuffle(C.pools[i]);return C.decks[i].pop()}
function x2(){const R=C.R,n=R.r?R.r.n:0;return (R.ev&&R.ev.k==='blood'&&n<=R.ev.until)||Date.now()>=R.endAt-60000}
function nextRound(){const R=C.R;const n=(R.r?R.r.n:0)+1;const now=Date.now();
  R.r=R.mixed?{n,qk:null,qks:[drawQ(0),drawQ(1)],at:now,ans:[null,null],done:false,res:null}:{n,qk:drawQ(0),at:now,ans:[null,null],done:false,res:null};
  R.P.forEach(p=>{if(p&&p.freezeNext){p.freezeNext=false;p.frozenUntil=now+FREEZE_MS}});
  if(n>=4&&n%4===0)doEvent(n);
  push()}
function addLog(t){const R=C.R;R.log=(R.log||[]).concat(t).slice(-8)}
function flash(t,ic){const R=C.R;R.flash={id:(R.flash?R.flash.id:0)+1,t,ic:ic||''}}
function hasItem(p,k){return p.items.indexOf(k)}
function pay(p,amt,msgs,why){if(amt<=0)return 0;const i=hasItem(p,'shield');if(i>=0){p.items.splice(i,1);msgs.push('🛡️ 盾牌擋下了'+why);return 0}const v=Math.min(amt,Math.max(0,p.score));p.score-=v;msgs.push(why+' −'+v);return v}
function gain(p,amt,msgs,why){p.score+=amt;msgs.push(why+' +'+amt)}
function doEvent(n){const R=C.R;const ks=Object.keys(EVENTS).filter(k=>!R.ev||R.ev.k!==k);const k=ks[rnd(ks.length)];const E=EVENTS[k];R.ev={k,n:E.n,ic:E.ic,d:E.d,at:n,until:n+2};const P=R.P;
  if(k==='quake')P.forEach(p=>{if(p)p.pos=(p.pos+21)%24});
  if(k==='rift')P.forEach(p=>{if(p)p.pos=landCells()[rnd(12)]});
  if(k==='meteor'&&P[1]){const lead=P[0].score>=P[1].score?0:1;P[1-lead].score+=20;P[lead].score+=5}
  if(k==='bossfall'&&P[1]){const lead=P[0].score>=P[1].score?0:1;if(!P[lead].boss)P[lead].boss={hp:2,r:0}}
  addLog(E.ic+' '+E.n+'：'+E.d);flash(E.n+'！'+E.d,E.ic)}
const landCells=()=>CELLS.map((c,i)=>c.t==='land'?i:-1).filter(i=>i>=0);
function cellEffect(i,msgs,mult,depth){const R=C.R,p=R.P[i],o=R.P[1-i];const c=CELLS[p.pos];
  if(c.t==='land'){const L=R.land[p.pos];
    if(!L){R.land[p.pos]={o:i,lv:1};msgs.push('🚩 佔領「'+c.n+'」！')}
    else if(L.o===i){if(L.lv<3){L.lv++;msgs.push((L.lv===2?'🏠':'🏰')+' 「'+c.n+'」升級'+(L.lv===3?'成城堡！':'成小屋！'))}else{gain(p,5*mult,msgs,'🏰 回到自己的城堡')}}
    else{const toll=TOLL[L.lv]*mult;const v=pay(p,toll,msgs,'付過路費給 '+(o?o.name:'對手'));if(v&&o){o.score+=v}}}
  else if(c.t==='chance')chance(i,msgs,mult,depth);

function chance(i,msgs,mult,depth){const R=C.R,p=R.P[i],o=R.P[1-i];

  else if(k==='走錯路'){p.pos=(p.pos+22)%24;msgs.push('❔ 機會卡：走錯路，後退 2 格')}

  else if(k==='雙倍骰'){p.dbl=true;msgs.push('❔ 機會卡：下次擲骰 ×2')}
  else if(k==='逆轉'&&o){gain(p,15,msgs,'❔ 逆轉卡！');const v=pay(o,10,[],'');msgs.push('對手 −'+v)}
  else gain(p,10*mult,msgs,'❔ 機會卡：零用錢')}
function resolve(){const R=C.R,r=R.r;r.done=true;r.doneAt=Date.now();const mult=x2()?2:1;const its=[0,1].map(i=>itemFor(i)||{});const uns=[0,1].map(i=>{const k=qkFor(r,i);if(!k||!R.P[i])return '';const u=unitsOf(R.subj,pubFor(R,i)).find(x=>x.id===k.split('|')[0]);return u?u.name:''});
  const res=[null,null];const live=[0,1].filter(i=>R.P[i]);
  live.forEach(i=>{const p=R.P[i];if(p.shop&&p.shop<=r.n)p.shop=0;p.n++;const a=r.ans[i];res[i]={ok:!!(a&&a.ok),msgs:[],from:p.pos,roll:0};if(uns[i]){p.us=p.us||{};const st=p.us[uns[i]]||(p.us[uns[i]]=[0,0]);st[1]++;if(a&&a.ok)st[0]++}
    if(a&&a.ok){p.ok++;p.streak++;p.best=Math.max(p.best,p.streak)}else{p.streak=0;const it=its[i];p.wrong=(p.wrong||[]).concat({u:uns[i],q:String(qText(it)||'').slice(0,120),a:a?a.a:'',r:it.type?rightText(it):''}).slice(-30)}});
  const both=live.length===2&&res[0].ok&&res[1].ok;
  const order=live.slice().sort((x,y)=>((r.ans[x]||{}).ms||9e9)-((r.ans[y]||{}).ms||9e9));
  order.forEach(i=>{const p=R.P[i],m=res[i].msgs;
    if(res[i].ok){gain(p,10*mult,m,'答對');
      if(both&&!R.mixed&&order[0]===i)gain(p,5*mult,m,'⚡ 搶先');
      if(p.streak>0&&p.streak%3===0)gain(p,5*mult,m,'🔥 連對 '+p.streak+' 題');
      if(p.boss){p.boss.hp--;if(p.boss.hp<=0){p.boss=null;gain(p,30*mult,m,'⚔️ 打倒魔王！');const ks=Object.keys(ITEMS);const k=ks[rnd(ks.length)];if(p.items.length<4){p.items.push(k);m.push('🎁 寶箱掉出 '+ITEMS[k].ic+ITEMS[k].n)}res[i].boss='win'}else{m.push('⚔️ 打中魔王！還剩 '+p.boss.hp+' 滴血');res[i].boss='hit'}}
      else if(p.stuck){p.stuck=0;m.push('🕸️ 掙脫蜘蛛網了，下回合就能走')}
      else{let roll=1+rnd(6);if(p.dbl){p.dbl=false;roll*=2;m.push('🎲 雙倍骰！')}res[i].roll=roll;const to=p.pos+roll;if(to>=24)gain(p,20*mult,m,'🚩 經過起點');p.pos=to%24;m.push('擲出 '+roll+' 點，走到「'+CELLS[p.pos].n+'」');cellEffect(i,m,mult,0)}}
    else{m.push(r.ans[i]?'答錯了，留在原地':'沒有作答，留在原地');
      if(p.boss){pay(p,5,m,'👹 被魔王打到');p.boss.r++;if(p.boss.r>=4){p.boss=null;m.push('魔王打累跑掉了')}}}
    res[i].to=p.pos});
  r.res=res;r.mult=mult;
  live.forEach(i=>addLog(R.P[i].name+'：'+res[i].msgs.join('，')));
  push()}
function applyAct(i,a){const R=C.R;if(!R||R.status!=='play')return;const p=R.P[i],o=R.P[1-i];if(!p)return;
  if(a.t==='ans'){if(R.r&&!R.r.done&&a.n===R.r.n&&!R.r.ans[i])R.r.ans[i]={ok:!!a.ok,a:String(a.a||'').slice(0,80),ms:+a.ms||Q_MS}}

    if(a.k==='freeze'){if(R.r&&!R.r.done&&!R.r.ans[1-i])o.frozenUntil=Date.now()+FREEZE_MS;else o.freezeNext=true;m.push('冰凍了 '+o.name)}

/* ---- each game's record -> one common shape ---- */
function norm(g,d){

    return {g,subj:'數學',pub:g==='kj'?'康軒':'南一',name:T(d.name),at:+d.at||0,what:d.mode==='battle'?'數學對戰':d.mode==='arcade'?'數學小遊戲':'數學大富翁',
      items:items.map(it=>{const k=it.k==='c'||it.k==='s';return {u:MU[it.u]||it.u||'',q:plain(it.stem),ok:!!it.ok,
        a:k?T(it.sa):(it.s>=0&&it.o?T(it.o[it.s]):'沒作答'),r:k?T(it.ca):(it.o?T(it.o[it.a]):'')}})}}
  if(g==='so'){if(d.mode==='learn'||!Array.isArray(d.items)||!d.items.length)return null;
    return {g,subj:'社會',pub:SOV[d.ver]||'',name:T(d.name),at:+d.at||0,what:'社會大冒險・'+(SOU[d.stage]||d.stage||''),
      items:d.items.map(it=>({u:SOU[d.stage]||d.stage||'',q:T(it.q),ok:!!it.ok,a:T(it.sa),r:T(it.a)}))}}
  if(g==='enh'||g==='enj'){const n=+d.n||0;if(!n)return null;const U=ENU[g];const units={};
    Object.entries(d.u||{}).forEach(([k,v])=>{if(Array.isArray(v))units[U[k]||k]=[+v[0]||0,+v[1]||0]});
    const un=U[d.unit]||d.unit||'';
    return {g,subj:'英語',pub:g==='enh'?'翰林':'何嘉仁',name:T(d.name),at:+d.at||0,what:(g==='enh'?'英語闖關':'何嘉仁英語闖關')+(d.what?'・'+d.what:''),
      n,c:Math.min(+d.c||0,n),units,items:(d.misses||[]).map(m=>({u:un,q:'英文：'+T(m),ok:false,a:'',r:''}))}}
  if(g==='zh'){const items=Array.isArray(d.items)?d.items:[];if(!items.length)return null;const Z=window.PZH||{t:{},q:{},w:{}};
    return {g,subj:'國語',pub:(d.vers||[])[0]||(items[0]&&items[0].v)||'',name:T(d.name),at:+d.timestamp||0,what:'國語闖關',
      items:items.map(it=>{const ttl=Z.t[it.v+'|'+it.n];const u='第'+it.n+'課'+(ttl?' '+ttl:'');const id=String(it.id||'');const rev=/^R/.test(id)&&id.length<=3;const ch=rev?id.slice(1):id;let q;
        if(it.k==='zhuyin')q=rev?'選出注音正確的字：「'+ch+'」':'「'+ch+'」的注音';

        return {u,q:'【'+(ZHK[it.k]||'')+'】'+q,ok:!!it.ok,a:T(it.c),r:T(it.a)}})}}
  return null}

function build(){
  const roster=students();const byName={};roster.forEach(s=>{byName[T(s.name)]=s.id});
  const st={};roster.forEach(s=>st[s.id]={sid:s.id,subj:{},sess:[],last:0});
  const other={};
  const sub=(o,subj)=>o.subj[subj]||(o.subj[subj]={n:0,c:0,sess:0,last:0,units:{},wq:{},pub:''});
  const add=(sid,r)=>{const o=st[sid];if(!o)return;const b=sub(o,r.subj);b.sess++;b.last=Math.max(b.last,r.at);b.pub=b.pub||r.pub;o.last=Math.max(o.last,r.at);
    let n=0,c=0;
    if(r.n!=null){n=r.n;c=r.c;Object.entries(r.units||{}).forEach(([u,v])=>{const x=b.units[u]||(b.units[u]=[0,0]);x[0]+=v[0];x[1]+=v[1]})}
    r.items.forEach(it=>{if(r.n==null){n++;if(it.ok)c++;if(it.u){const x=b.units[it.u]||(b.units[it.u]=[0,0]);x[1]++;if(it.ok)x[0]++}}
      if(!it.q)return;const k=it.q;const w=b.wq[k]||(b.wq[k]={q:it.q,u:it.u,src:r.what,miss:0,lastW:0,lastOk:0,a:'',r:''});
      if(it.ok){w.lastOk=Math.max(w.lastOk,r.at)}else{w.miss++;if(r.at>=w.lastW){w.lastW=r.at;w.a=it.a;w.r=it.r||w.r;w.src=r.what;w.u=it.u||w.u}}});
    b.n+=n;b.c+=c;o.sess.push({at:r.at,subj:r.subj,what:r.what,n,c})};
  SRC.forEach(s=>(P.raw[s.g]||[]).forEach(d=>{const r=norm(s.g,d);if(!r)return;const sid=byName[r.name];if(sid)add(sid,r);else if(r.name){other[r.name]=(other[r.name]||0)+1}}));

  const head=`<div class="row" style="margin-bottom:10px"><button class="btn ghost sm" data-act="pgBack">← 全部學生</button></div>
  <div class="panel pg-head"><span class="av">${esc(avOf(s.id))}</span><div><h2>${esc(s.name)}</h2><div class="small muted">${esc(s.school)}・${liveOf(s.id)?`<span class="pg-on">🟢 正在玩${esc(gname(liveOf(s.id).g))}（${mins(liveOf(s.id).since)}）</span>`:'最近：'+(o.last?ago(o.last):'還沒玩')}</div></div></div>`;
  if(!have.length)return head+'<div class="panel" style="margin-top:12px"><p class="muted">這位學生還沒有任何紀錄。在地城闖關或決鬥之後，這裡就會出現他的學習狀況。</p></div>';
  const cards=have.map(k=>{const b=o.subj[k];const p=pct(b.c,b.n);const open=Object.values(b.wq).filter(w=>w.miss&&w.lastOk<w.lastW).length;
    return `<button class="pg-card ${lvl(p)} ${subj===k?'on':''}" data-act="pgSubj" data-v="${k}"><span class="small muted">${k}${b.pub?'・'+esc(b.pub):''}</span><b>${p}%</b><i style="--w:${p}%"></i><small>答對 ${b.c}/${b.n} 題・${b.sess} 次${open?`・待訂正 ${open}`:''}</small></button>`}).join('');
  const show=subj?[subj]:have;
  const units=[];show.forEach(k=>Object.entries(o.subj[k].units).forEach(([u,v])=>{if(v[1])units.push({k,u,c:v[0],n:v[1],p:pct(v[0],v[1])})}));
  units.sort((a,b)=>a.p-b.p||b.n-a.n);
  const weak=units.filter(x=>x.p<75&&x.n>=3).slice(0,3);
  const uh=units.map(x=>`<div class="pg-unit ${lvl(x.p)}"><span>${show.length>1?`<em>${x.k}</em>`:''}${esc(x.u)}</span><i><b style="width:${x.p}%"></b></i><small>${x.p}%・${x.c}/${x.n}</small></div>`).join('');
  let W=[];show.forEach(k=>Object.values(o.subj[k].wq).forEach(w=>{if(w.miss)W.push(Object.assign({k,fixed:w.lastOk>w.lastW},w))}));
  const nFixed=W.filter(w=>w.fixed).length;if(!P.showFixed)W=W.filter(w=>!w.fixed);
  W.sort((a,b)=>b.miss-a.miss||b.lastW-a.lastW);const total=W.length;if(!P.showAll)W=W.slice(0,40);
  const wh=W.map(w=>`<li class="${w.fixed?'fixed':''}"><div class="pg-wtop">${show.length>1?`<span class="pg-tag">${w.k}</span>`:''}${w.u?`<span class="pg-tag u">${esc(w.u)}</span>`:''}${w.miss>1?`<span class="pg-tag x">錯 ${w.miss} 次</span>`:''}${w.fixed?'<span class="pg-tag ok">後來答對了</span>':''}<span class="small muted" style="margin-left:auto">${dstr(w.lastW)}・${esc(w.src)}</span></div>
    <div class="pg-q">${esc(w.q)}</div>${w.a||w.r?`<div class="small">${w.a?`<span style="color:var(--bad)">他答：${esc(w.a)}</span>　`:''}${w.r?`<span style="color:var(--good)">正解：${esc(w.r)}</span>`:''}</div>`:''}</li>`).join('');
  const ss=o.sess.filter(x=>!subj||x.subj===subj).slice(0,12).map(x=>`<tr><td>${dstr(x.at)} ${x.at?new Date(x.at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}):''}</td><td>${esc(x.what)}</td><td>${x.c}/${x.n}</td><td class="${lvl(pct(x.c,x.n))}-t">${pct(x.c,x.n)??'—'}%</td></tr>`).join('');
  return `${head}
  <div class="pg-cards"><button class="pg-card all ${!subj?'on':''}" data-act="pgSubj" data-v=""><span class="small muted">全部科目</span><b>${pct(have.reduce((a,k)=>a+o.subj[k].c,0),have.reduce((a,k)=>a+o.subj[k].n,0))}%</b><small>點科目卡片只看那一科</small></button>${cards}</div>
  ${weak.length?`<div class="panel pg-weak"><b>🎯 最需要加強</b>${weak.map(x=>`<span>${show.length>1?x.k+'・':''}${esc(x.u)}（${x.p}%）</span>`).join('')}</div>`:''}
  <div class="pg-grid"><div class="panel"><h3>單元掌握度</h3><p class="small muted">由弱到強排列。</p>${uh||'<p class="muted small">還沒有單元資料。</p>'}</div>
  <div class="panel"><div class="spread"><h3>錯題本</h3><button class="btn ghost sm" data-act="pgFixed">${P.showFixed?'隱藏已答對的':'顯示後來答對的'+(nFixed?`（${nFixed}）`:'')}</button></div>
  <p class="small muted">錯越多次排越前面。${P.showFixed?'':'後來再遇到同一題答對了，就會自動收起來。'}</p>
  ${wh?`<ul class="pg-wl">${wh}</ul>`:`<p class="muted">${nFixed?'錯過的題目後來都答對了 👍':'目前沒有錯題。'}</p>`}
  ${total>W.length?`<button class="btn ghost sm" data-act="pgAll">再顯示 ${total-W.length} 題</button>`:''}</div></div>
  <div class="panel" style="margin-top:14px"><h3>最近的練習</h3>${ss?`<div class="tbl" style="margin-top:8px"><table><thead><tr><th>時間</th><th>玩了什麼</th><th>答對</th><th>答對率</th></tr></thead><tbody>${ss}</tbody></table></div>`:'<p class="muted small">沒有紀錄。</p>'}
  <p class="small muted" style="margin-top:8px">英語闖關只記得答錯的單字或句子，所以英語的錯題沒有「他答／正解」。</p></div>`}
function view(){start();return P.sid?vStu():vList()}
const PA={
  pgSchool:e=>{P.school=e.dataset.v;render()},
  pgOpen:e=>{SFX.tap();P.sid=e.dataset.id;P.subj='';P.showFixed=false;P.showAll=false;render();window.scrollTo(0,0)},
  pgBack:()=>{P.sid=null;render()},
  pgSubj:e=>{SFX.tap();P.subj=e.dataset.v;P.showAll=false;render()},
  pgFixed:()=>{P.showFixed=!P.showFixed;render()},
  pgAll:()=>{P.showAll=true;render()},
};
return {view,stop,A:PA,dirty:()=>{P.dirty=true}};
})();

window.DUEL=DUEL;window.PROG=PROG;
render();initDb();
})();
</script>

</body></html>
