<style>
/* Layout: one column of six big "islands" (units, in the same order as the daily word tasks); each island plays 4–5 short mini-games in a row. Committed bright, single look for kids. */
:root {

}

.sky { position: relative; height: max(440px, 62vh); border-radius: 20px; overflow: hidden; background: linear-gradient(#bfe9ff, #eaf8ff); touch-action: manipulation; user-select: none; -webkit-user-select: none; }

<script>/* =========================================================
   老師後台（英語闖關／英語大富翁共用）
   - 老師帳號登入的裝置：成績與即時狀況存進資料庫（只有老師能讀寫）
   - 其他裝置：結束時給一串代碼，老師貼進後台匯入
   - 後台有密碼鎖，學生一開始玩就自動鎖定
   ========================================================= */
const BK = (() => {
  const CFG = window.BK_CFG || { game: 'quest', title: '英語', cats: {} };
  const ENV = { owner: false, db: null, pin: null, pinLoaded: false, unlocked: false };
  let TEST = false; // 老師試玩模式：不記錄成績、不寫即時狀況
  const E = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clamp = (s, n) => String(s == null ? '' : s).slice(0, n);
  const normName = s => String(s || '').trim().replace(/\s+/g, '');
  const pct = (c, n) => n ? Math.round(100 * c / n) : null;
  const fmt = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const ago = ms => ms < 60000 ? Math.max(0, Math.floor(ms / 1000)) + ' 秒前' : Math.floor(ms / 60000) + ' 分鐘前';
  const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const catName = k => (CFG.cats[k] || k);

  /* ---------- 樣式（後台自己一套，不受遊戲主題影響） ---------- */
  const css = document.createElement('style');
  css.textContent = `

.bk-ov input,.bk-ov textarea,.bk-modal input,.bk-share textarea{background:#fff!important;color:#1d2b53!important;font-family:inherit}

.bk-card{background:#fff;border:1px solid #d6deeb;border-radius:16px;padding:16px}
.bk-card h2{margin:0 0 8px;font-size:18px;font-weight:900}

.bk-tbar .pill.x{background:#fff;color:#b3261e;border:2px solid #b3261e}

.bk-tbar h4{margin:8px 0 4px;font-size:13px;color:#5b6782}
.bk-tbar .row{display:flex;flex-wrap:wrap;gap:6px}
.bk-tbar .row button,.bk-tbar select{border:2px solid #d6deeb;background:#f4f6fb;border-radius:10px;padding:6px 10px;font:600 14px inherit;font-family:inherit;color:#1d2b53;cursor:pointer}
.bk-tbar .row button.on{background:#7b61ff;color:#fff;border-color:#7b61ff}
.bk-tbar .note{font-size:13px;color:#5b6782;margin-top:6px}
.bk-share{margin-top:12px;background:#fff;border:2px solid #c9d3e6;border-radius:16px;padding:12px 14px;text-align:left;color:#1d2b53;width:min(560px,100%)}
`;
  document.head.appendChild(css);

  /* ---------- 啟動：判斷是不是老師帳號 ---------- */
  let btn = null;
  async function boot() {
    try {
      if (!window.BR || !window.BR.use) return;
      const user = await BR.use('user');
      if (!user || !(await user.isOwner())) return;
      const db = await BR.use('db'); if (!db) return;
      ENV.owner = true; ENV.db = db;
      try { const s = await db.collection('settings').doc('pin').get(); const d = s.exists ? s.data() : null; ENV.pin = d && d.hash ? { salt: String(d.salt || ''), hash: String(d.hash) } : null; } catch (e) { ENV.pin = null; }
      ENV.pinLoaded = true;
      btn = document.createElement('button'); btn.type = 'button'; btn.className = 'bk-btn'; btn.textContent = '🔒 老師';
      btn.onclick = () => (!ENV.pin || ENV.unlocked) ? openDash() : askPin();
      document.body.appendChild(btn);
      if (LV.doc) push();
    } catch (e) { /* 沒有老師功能，維持學生模式 */ }
  }
  function lock() { ENV.unlocked = false; closeDash(); }

  /* ---------- 密碼 ---------- */
  async function hashPin(pin, salt) {
    const data = new TextEncoder().encode(salt + ':' + pin);
    try { const d = await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(d)).map(x => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let x = 5381; for (let i = 0; i < data.length; i++) x = ((x * 33) ^ data[i]) >>> 0; return 'x' + x.toString(16); }
  }
  function askPin() {
    const m = document.createElement('div'); m.className = 'bk-modal';
    m.innerHTML = `<div class="bk-card"><h2>老師密碼</h2><div class="bk-row"><input class="bk-in" id="bk-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="老師密碼"><button class="bk-b" id="bk-go" type="button">解鎖</button><button class="bk-b g" id="bk-x" type="button">取消</button></div><div class="bk-err" id="bk-pe"></div></div>`;
    document.body.appendChild(m);
    const inp = m.querySelector('#bk-pin'); setTimeout(() => inp.focus(), 30);
    const go = async () => { if (await hashPin(inp.value, ENV.pin.salt) === ENV.pin.hash) { ENV.unlocked = true; m.remove(); openDash(); } else { m.querySelector('#bk-pe').textContent = '密碼不對'; inp.value = ''; } };
    m.querySelector('#bk-go').onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    m.querySelector('#bk-x').onclick = () => m.remove();
    m.onclick = e => { if (e.target === m) m.remove(); };
  }

  /* ---------- 即時狀況（每答一題寫一次，很小的一筆） ---------- */
  const LV = { id: null, doc: null, q: null, pend: false };
  function liveStart(base) {
    if (TEST) { LV.doc = null; return; }
    LV.id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    LV.doc = Object.assign({ game: CFG.game, t0: Date.now(), st: 'play', n: 0, c: 0, hist: '', score: 0, u: {}, lastAns: Date.now() }, base);
    push();
  }
  function liveSet(patch) { if (!LV.doc) return; Object.assign(LV.doc, patch); push(); }
  function liveAnswer(ok, info, cat, who) {
    const d = LV.doc; if (!d) return;
    d.n++; if (ok) d.c++; d.hist = (d.hist + (ok ? 'o' : 'x')).slice(-12); d.lastAns = Date.now();
    if (cat) { const a = d.u[cat] || (d.u[cat] = [0, 0]); a[1]++; if (ok) a[0]++; }
    if (!ok && info) d.lw = { t: clamp(info, 120), at: Date.now(), who: who ? clamp(who, 16) : '' };
    push();
  }
  function liveEnd(st) {
    if (!LV.doc) return; const doc = LV.doc, id = LV.id; doc.st = st || 'done'; LV.doc = null;
    if (!ENV.owner || !ENV.db) return;
    (async () => { try { await LV.q; } catch (e) { /* ignore */ } try { await ENV.db.collection('live').doc(id).set(Object.assign({}, doc, { upd: Date.now() })); } catch (e) { /* ignore */ } })();
  }
  function push() {
    if (!ENV.owner || !ENV.db || !LV.doc) return;
    if (LV.q) { LV.pend = true; return; }
    const id = LV.id, doc = LV.doc;
    LV.q = (async () => {
      try { do { LV.pend = false; await ENV.db.collection('live').doc(id).set(Object.assign({}, doc, { upd: Date.now() })); } while (LV.pend && LV.doc === doc); } catch (e) { /* 寫不進去也不影響遊戲 */ }
      LV.q = null; if (LV.pend && LV.doc) push();
    })();
  }

  /* ---------- 成績：老師裝置直接存；其他裝置給代碼 ---------- */
  function b64u(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64u(str) { let s = str.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s); const u8 = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u8[i] = b.charCodeAt(i); return u8; }
  async function encodeCode(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream !== 'undefined') {
      try { const cs = new CompressionStream('gzip'); const w = cs.writable.getWriter(); w.write(bytes); w.close(); return 'EN1.' + b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer())) + '~'; } catch (e) { /* 退回未壓縮 */ }
    }
    return 'EN0.' + b64u(bytes) + '~';
  }
  async function decodeCode(code) {
    const m = code.match(/^EN([01])\.([A-Za-z0-9_-]+)~$/); if (!m) throw new Error('格式不對');
    let bytes = unb64u(m[2]); if (bytes.length > 200000) throw new Error('內容過大');
    if (m[1] === '1') {
      if (typeof DecompressionStream === 'undefined') throw new Error('這個瀏覽器無法解壓縮');
      const ds = new DecompressionStream('gzip'); const w = ds.writable.getWriter(); w.write(bytes).catch(() => {}); w.close().catch(() => {});
      bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer()); if (bytes.length > 400000) throw new Error('內容過大');
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  const findCodes = t => { const out = []; const re = /EN[01]\.[A-Za-z0-9_\-\s]*?~/g; let m; while ((m = re.exec(t))) out.push(m[0].replace(/\s+/g, '')); return out; };
  /* 匯入的資料一律當作不可信：逐欄檢查、截長度 */
  function sanitize(p) {
    if (!p || typeof p !== 'object') throw new Error('內容不是紀錄');
    if (p.game !== CFG.game) throw new Error(p.game === 'quest' ? '這是「英語闖關」的代碼，請貼到闖關的後台' : p.game === 'mono' ? '這是「英語大富翁」的代碼，請貼到大富翁的後台' : '不是這個遊戲的代碼');
    const id = String(p.id || ''); if (!/^[A-Za-z0-9_-]{4,60}$/.test(id)) throw new Error('編號不合格式');
    const num = (v, lo, hi) => { v = Math.round(Number(v)); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : lo; };
    const u = {}; if (p.u && typeof p.u === 'object') Object.keys(p.u).slice(0, 12).forEach(k => { if (CFG.cats[k] && Array.isArray(p.u[k])) { const c = num(p.u[k][0], 0, 999), n = num(p.u[k][1], 0, 999); u[k] = [Math.min(c, n), n]; } });
    const out = { id, game: CFG.game, name: clamp(p.name, 20).trim() || '（未填姓名）', at: num(p.at, 0, 4102444800000), ms: num(p.ms, 0, 7200000), score: num(p.score, 0, 100000),
      n: num(p.n, 0, 999), c: num(p.c, 0, 999), u, misses: Array.isArray(p.misses) ? p.misses.slice(0, 60).map(x => clamp(x, 120)) : [], what: clamp(p.what, 40), quit: p.quit === true };
    if (out.c > out.n) out.c = out.n;
    if (p.exam != null) out.exam = num(p.exam, 0, 100);
    if (p.stars != null) out.stars = num(p.stars, 0, 3);
    if (p.unit) out.unit = clamp(p.unit, 8);
    if (p.coins != null) { out.coins = num(p.coins, -100000, 100000); out.worth = num(p.worth, -100000, 100000); out.rank = num(p.rank, 1, 4); out.np = num(p.np, 1, 4); }
    if (p.av) out.av = clamp(p.av, 8);
    return out;
  }
  /* 回傳 null（已存進後台）或代碼字串（要傳給老師） */
  async function saveResult(rec) {
    if (TEST) return null;
    rec = Object.assign({ id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), game: CFG.game, at: Date.now() }, rec);
    rec.misses = [...new Set(rec.misses || [])].slice(0, 60);
    if (ENV.owner && ENV.db) {
      try { await ENV.db.collection('results').doc(rec.id).set(rec); return null; } catch (e) { /* 存不進去就給代碼 */ }
    }
    try { return await encodeCode(rec); } catch (e) { return null; }
  }
  /* 結果畫面用的「代碼」區塊 */
  function codeBox(code, who) {
    if (TEST) return '<div class="bk-share">🧪 試玩模式：這局不會記錄成績。</div>';
    if (!code) return ENV.owner ? '<div class="bk-share">✅ 成績已經存進老師後台。</div>' : '';
    const id = 'bkc' + Math.random().toString(36).slice(2, 7);
    setTimeout(() => {
      const b = document.getElementById(id + 'b'), t = document.getElementById(id);
      if (b && t) b.onclick = async () => { try { await navigator.clipboard.writeText(t.value); b.textContent = '已複製'; } catch (e) { t.focus(); t.select(); b.textContent = '請長按選取後複製'; } };
    }, 0);
    return `<div class="bk-share"><b>${who ? E(who) + '：' : ''}把這串代碼傳給老師</b><div class="bk-muted">老師貼進後台，成績就會記錄下來。</div>
      <textarea class="bk-code" id="${id}" readonly>${E(code)}</textarea><div class="bk-row" style="margin-top:6px"><button class="bk-b" type="button" id="${id}b">複製代碼</button></div></div>`;
  }

  /* ---------- 後台資料 ---------- */
  const RS = { docs: [], loaded: false, sub: false, err: '' };
  const LIVE = { docs: [], loaded: false, sub: false, err: false, purged: false };
  const T = { sel: null, play: null, msg: '', del: null };
  function subscribe() {
    if (!ENV.db) return;
    if (!RS.sub) { RS.sub = true; try { ENV.db.collection('results').onSnapshot(s => { RS.docs = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })).filter(d => d && d.game === CFG.game); RS.loaded = true; RS.err = ''; refresh(); }, () => { RS.err = '成績讀取失敗'; RS.loaded = true; refresh(); }); } catch (e) { RS.err = '無法連接資料庫'; RS.loaded = true; } }
    if (!LIVE.sub) { LIVE.sub = true; try { ENV.db.collection('live').onSnapshot(s => { LIVE.docs = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })).filter(d => d && d.game === CFG.game && typeof d.upd === 'number'); LIVE.loaded = true; LIVE.err = false; purge(s.docs); refreshLive(); }, () => { LIVE.err = true; LIVE.loaded = true; refreshLive(); }); } catch (e) { LIVE.err = true; LIVE.loaded = true; } }
  }
  function purge(docs) {
    if (LIVE.purged) return; LIVE.purged = true; const old = Date.now() - 6 * 3600e3;
    docs.filter(d => { const v = d.data() || {}; return typeof v.upd === 'number' && v.upd < old; }).slice(0, 40).forEach(d => { try { ENV.db.collection('live').doc(d.id).delete().catch(() => {}); } catch (e) { /* ignore */ } });
  }
  function meter(label, a, sub) {
    const n = a ? a[1] : 0, c = a ? a[0] : 0, p = pct(c, n);
    const col = p == null ? '#c9d3e6' : p < 60 ? '#b3261e' : p < 80 ? '#c98a00' : '#0f7a46';
    return `<div class="bk-m"><span>${E(label)}${sub ? `<div class="bk-muted" style="font-size:12px">${E(sub)}</div>` : ''}</span><span class="bk-bar"><i style="width:${p || 0}%;background:${col}"></i></span><span class="bk-muted">${p == null ? '—' : p + '%（' + c + '/' + n + '）'}</span></div>`;
  }
  const add = (o, k, c, n) => { const a = o[k] || (o[k] = [0, 0]); a[0] += c; a[1] += n; };
  function students() {
    const m = {};
    RS.docs.forEach(d => { const k = normName(d.name) || '（未填姓名）'; const s = m[k] || (m[k] = { key: k, name: d.name, av: d.av, all: [], u: {}, c: 0, n: 0, best: null, last: 0, miss: {} }); s.all.push(d); s.c += d.c || 0; s.n += d.n || 0; s.last = Math.max(s.last, d.at || 0); if (d.av) s.av = d.av;
      Object.keys(d.u || {}).forEach(k2 => add(s.u, k2, d.u[k2][0], d.u[k2][1])); (d.misses || []).forEach(x => s.miss[x] = (s.miss[x] || 0) + 1);
      const sc = CFG.game === 'quest' ? d.exam : d.worth; if (sc != null && (s.best == null || sc > s.best)) s.best = sc; });
    return Object.values(m).map(s => { s.all.sort((a, b) => a.at - b.at); const ks = Object.keys(s.u).filter(k => s.u[k][1] >= 2).sort((a, b) => s.u[a][0] / s.u[a][1] - s.u[b][0] / s.u[b][1]); s.weak = ks[0] || null; return s; });
  }

  /* ---------- 後台畫面 ---------- */
  let ov = null, tick = null;
  function openDash() {
    closeDash();
    ov = document.createElement('div'); ov.className = 'bk-ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', '老師後台');
    ov.innerHTML = `<div class="bk-wrap">
      <div class="bk-head"><h1>老師後台・${E(CFG.title)}</h1>${ENV.pin ? '<button class="bk-b g" type="button" id="bk-lock">鎖定</button>' : ''}<button class="bk-b" type="button" id="bk-close">回到遊戲</button></div>
      <div id="bk-pincard"></div>${window.BK_TEST ? `<div class="bk-card"><h2>🧪 老師試玩模式</h2><p class="bk-muted" style="margin:0 0 8px">自己測遊戲用：可以跳關、指定骰子、直接看結算、檢查題目和發音。試玩的局不會記錄成績，也不會出現在即時狀況。</p><button class="bk-b" type="button" id="bk-test">${TEST ? '回到試玩' : '開始試玩'}</button></div>` : ''}<div class="bk-card" id="bk-live"></div><div id="bk-over"></div>
      <div class="bk-two"><div style="display:grid;gap:14px"><div id="bk-list"></div><div id="bk-imp"></div></div><div id="bk-detail"></div></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#bk-close').onclick = closeDash;
    const lk = ov.querySelector('#bk-lock'); if (lk) lk.onclick = lock;
    const tb = ov.querySelector('#bk-test'); if (tb) tb.onclick = () => { TEST = true; closeDash(); testBar(true); };
    pinCard(); importCard(); subscribe(); refreshLive(); refresh();
    clearInterval(tick); tick = setInterval(refreshLive, 5000);
  }
  function closeDash() { if (ov) { ov.remove(); ov = null; } clearInterval(tick); tick = null; }
  const $o = id => ov && ov.querySelector('#' + id);

  function pinCard() {
    const el = $o('bk-pincard'); if (!el) return;
    el.innerHTML = `<div class="bk-card ${ENV.pin ? '' : 'bk-warn'}"><b>${ENV.pin ? '老師密碼（已設定，可在這裡更改）' : '請先設定老師密碼'}</b>
      <div class="bk-muted" style="margin:4px 0 8px">學生用你的平板玩之前按「鎖定」，學生就進不來後台。學生一按開始，也會自動鎖定。</div>
      <div class="bk-row"><input class="bk-in" id="bk-np" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="4～12 位數字" aria-label="新的老師密碼"><button class="bk-b" type="button" id="bk-sp">${ENV.pin ? '更改密碼' : '設定密碼'}</button><span class="bk-muted" id="bk-pm"></span></div></div>`;
    el.querySelector('#bk-sp').onclick = async () => {
      const v = el.querySelector('#bk-np').value.trim(), msg = el.querySelector('#bk-pm');
      if (!/^\d{4,12}$/.test(v)) { msg.textContent = '請輸入 4～12 位數字'; return; }
      const salt = Math.random().toString(36).slice(2, 10), hash = await hashPin(v, salt);
      try { await ENV.db.collection('settings').doc('pin').set({ salt, hash, at: Date.now() }); ENV.pin = { salt, hash }; ENV.unlocked = true; openDash(); const m = $o('bk-pm'); if (m) m.textContent = '已設定。按上面的「鎖定」，學生就看不到後台。'; }
      catch (e) { msg.textContent = '儲存失敗，請再試一次'; }
    };
  }

  function liveRow(d, now) {
    const since = Math.floor((now - (d.lastAns || d.t0)) / 1000);
    let chip, cls;
    if (d.st === 'done') { chip = '已結束'; cls = ''; }
    else if (d.st === 'quit') { chip = '中途離開'; cls = ''; }
    else if (now - d.upd > 5 * 60000) { chip = '沒有回應'; cls = 'gone'; }
    else if (since >= 60) { chip = since + ' 秒沒作答'; cls = 'warn'; }
    else { chip = '進行中'; cls = 'ok'; }
    const dots = (d.hist || '').split('').map(ch => `<i class="bk-dot ${ch === 'o' ? 'o' : ''}" title="${ch === 'o' ? '對' : '錯'}"></i>`).join('');
    const players = Array.isArray(d.players) ? `<table class="bk-mini"><tr><th>玩家</th><th>金幣</th><th>答對</th></tr>${d.players.map(p => `<tr${p.name === d.cur ? ' style="background:#fff3c4"' : ''}><td>${E(p.av || '')} ${E(p.name)}${p.cpu ? ' 🤖' : ''}</td><td>${p.coins}</td><td>${p.cpu ? '—' : p.c + '/' + p.n}</td></tr>`).join('')}</table>` : '';
    return `<div class="bk-lv ${cls}"><div class="bk-lvt"><b style="font-size:17px">${E(d.av || '')} ${E(d.name)}</b><span class="bk-pill">${E(d.what || '')}</span><span class="bk-pill ${cls}">${chip}</span><span class="bk-muted" style="margin-left:auto">已玩 ${mmss((d.st === 'play' ? now : d.upd) - d.t0)}</span></div>
      <div class="bk-row" style="margin-top:4px;font-size:15px">${d.score != null ? `<span>分數 <b>${d.score}</b></span>` : ''}<span>答 <b>${d.n}</b> 題，對 <b>${d.c}</b>${d.n ? '（' + pct(d.c, d.n) + '%）' : ''}</span>${dots ? `<span class="bk-dots">${dots}</span>` : ''}</div>
      ${d.stage && d.st === 'play' ? `<div class="bk-muted">正在玩：${E(d.stage)}${d.round ? '' : ''}</div>` : ''}${d.cur && d.st === 'play' ? `<div class="bk-muted">第 ${d.round || 1} 回合，輪到 ${E(d.cur)}</div>` : ''}${players}</div>`;
  }
  function refreshLive() {
    const el = $o('bk-live'); if (!el) return;
    const now = Date.now();
    let h = `<div class="bk-row" style="justify-content:space-between"><h2 style="margin:0">即時狀況</h2><button class="bk-b g" type="button" id="bk-clr">清空這裡的即時資料</button></div>`;
    if (LIVE.err) h += '<div class="bk-err">即時資料讀取失敗</div>';
    if (!LIVE.loaded) h += '<p class="bk-muted">讀取中…</p>';
    else {
      const rows = LIVE.docs.filter(d => d.st === 'play' ? now - d.upd < 60 * 60000 : now - d.upd < 15 * 60000).sort((a, b) => (a.st !== 'play') - (b.st !== 'play') || b.upd - a.upd);
      if (!rows.length) h += '<p class="bk-muted">現在沒有人在玩。學生開始玩之後，這裡每答完一題就會更新（要用老師帳號登入的平板玩才看得到）。</p>';
      else {
        const playing = rows.filter(d => d.st === 'play' && now - d.upd <= 5 * 60000), stuck = playing.filter(d => (now - (d.lastAns || d.t0)) >= 60000);
        h += `<p class="bk-muted" style="margin:2px 0 6px">進行中 ${playing.length} 局${stuck.length ? '，其中 ' + stuck.length + ' 局超過 1 分鐘沒作答' : ''}。畫面每 5 秒自動更新。</p><div class="bk-grid">${rows.map(d => liveRow(d, now)).join('')}</div>`;
        const feed = rows.filter(d => d.lw && now - d.lw.at < 30 * 60000).sort((a, b) => b.lw.at - a.lw.at).slice(0, 8);
        if (feed.length) h += `<h3>剛剛答錯的</h3><ul class="bk-feed">${feed.map(d => `<li><b>${E(d.lw.who || d.name)}</b> <span class="bk-muted">${ago(now - d.lw.at)}</span><div>${E(d.lw.t)}</div></li>`).join('')}</ul>`;
        const ag = {}; rows.forEach(d => Object.keys(d.u || {}).forEach(k => add(ag, k, d.u[k][0], d.u[k][1])));
        const ks = Object.keys(CFG.cats).filter(k => ag[k] && ag[k][1]);
        if (ks.length) h += `<h3>這批學生各部分答對率</h3>${ks.map(k => meter(catName(k), ag[k])).join('')}`;
      }
    }
    el.innerHTML = h;
    el.querySelector('#bk-clr').onclick = () => { LIVE.docs.forEach(d => ENV.db.collection('live').doc(d.id).delete().catch(() => {})); LIVE.docs = []; refreshLive(); };
  }

  function refresh() {
    if (!ov) return;
    const over = $o('bk-over'), list = $o('bk-list'), det = $o('bk-detail');
    if (!RS.loaded) { over.innerHTML = '<div class="bk-card"><p class="bk-muted">讀取中…</p></div>'; return; }
    const ss = students();
    // 全班概況
    let h = `<div class="bk-card"><h2>全班概況</h2>${RS.err ? `<div class="bk-err">${E(RS.err)}</div>` : ''}`;
    if (!RS.docs.length) h += '<p class="bk-muted">還沒有任何紀錄。學生玩完會自動出現在這裡。</p>';
    else {
      const ag = {}, miss = {}; let c = 0, n = 0;
      RS.docs.forEach(d => { c += d.c || 0; n += d.n || 0; Object.keys(d.u || {}).forEach(k => add(ag, k, d.u[k][0], d.u[k][1])); (d.misses || []).forEach(x => miss[x] = (miss[x] || 0) + 1); });
      h += `<div class="bk-row" style="gap:18px;margin-bottom:6px"><span>玩過的學生 <b>${ss.length}</b></span><span>總局數 <b>${RS.docs.length}</b></span><span>全部答對率 <b>${n ? pct(c, n) + '%' : '—'}</b></span>${CFG.game === 'quest' ? `<span>模擬考 <b>${RS.docs.filter(d => d.exam != null).length}</b> 次，60 分以上 <b>${RS.docs.filter(d => d.exam >= 60).length}</b> 次</span>` : ''}</div>`;
      h += `<h3>各部分答對率</h3>${Object.keys(CFG.cats).map(k => meter(catName(k), ag[k])).join('')}`;
      const top = Object.keys(miss).sort((a, b) => miss[b] - miss[a]).slice(0, 12);
      h += `<h3>全班最常錯的</h3>${top.length ? `<ul class="bk-feed">${top.map(x => `<li>${E(x)} <span class="bk-muted">錯 ${miss[x]} 次</span></li>`).join('')}</ul>` : '<p class="bk-muted">還沒有錯題紀錄。</p>'}`;
    }
    over.innerHTML = h + '</div>';
    // 學生一覽
    const sorted = ss.sort((a, b) => b.last - a.last);
    list.innerHTML = `<div class="bk-card"><h2>學生一覽</h2>${!sorted.length ? '<p class="bk-muted">還沒有紀錄。</p>' : `<div style="overflow-x:auto"><table class="bk-tbl"><thead><tr><th>學生</th><th>局數</th><th>${CFG.game === 'quest' ? '模擬考最高' : '最高總資產'}</th><th>答對率</th><th>最需加強</th><th>最近</th></tr></thead><tbody>${sorted.map(s => `<tr data-k="${E(s.key)}" class="${T.sel === s.key ? 'sel' : ''}" tabindex="0"><td><b>${E(s.av || '')} ${E(s.name)}</b></td><td>${s.all.length}</td><td>${s.best == null ? '—' : s.best}</td><td>${s.n ? pct(s.c, s.n) + '%' : '—'}</td><td>${s.weak ? E(catName(s.weak)) : '—'}</td><td class="bk-muted">${fmt(s.last)}</td></tr>`).join('')}</tbody></table></div>`}</div>`;
    list.querySelectorAll('tr[data-k]').forEach(tr => { const go = () => { T.sel = tr.dataset.k; T.play = null; T.del = null; refresh(); }; tr.onclick = go; tr.onkeydown = e => { if (e.key === 'Enter') go(); }; });
    // 個人
    const s = sorted.find(x => x.key === T.sel);
    if (!s) { det.innerHTML = '<div class="bk-card bk-muted">從左邊選一位學生，這裡會顯示他每一局的成績和答錯的字。</div>'; return; }
    const p = s.all.find(x => x.id === T.play) || s.all[s.all.length - 1]; T.play = p.id;
    const tm = Object.keys(s.miss).sort((a, b) => s.miss[b] - s.miss[a]).slice(0, 10);
    det.innerHTML = `<div class="bk-card"><h2 style="font-size:21px">${E(s.av || '')} ${E(s.name)}</h2>
      <h3>各部分答對率（所有局合計）</h3>${Object.keys(CFG.cats).map(k => meter(catName(k), s.u[k])).join('')}
      <h3>最常錯的</h3>${tm.length ? `<ul class="bk-feed">${tm.map(x => `<li>${E(x)} <span class="bk-muted">錯 ${s.miss[x]} 次</span></li>`).join('')}</ul>` : '<p class="bk-muted">目前沒有錯題。</p>'}
      <h3>每一局</h3><div style="overflow-x:auto"><table class="bk-tbl"><thead><tr><th>時間</th><th>玩什麼</th><th>結果</th><th>答對</th></tr></thead><tbody>${s.all.slice().reverse().map(d => `<tr data-p="${E(d.id)}" class="${d.id === p.id ? 'sel' : ''}"><td class="bk-muted">${fmt(d.at)}</td><td>${E(d.what || '')}${d.quit ? ' <span class="bk-pill">中途離開</span>' : ''}${d.imported ? ' <span class="bk-pill">代碼匯入</span>' : ''}</td><td>${d.exam != null ? d.exam + ' 分' : d.worth != null ? '第 ' + d.rank + ' 名・$' + d.worth : d.stars != null ? '★'.repeat(d.stars) : '分數 ' + (d.score || 0)}</td><td>${d.c}/${d.n}</td></tr>`).join('')}</tbody></table></div>
      <h3>這一局答錯的（${fmt(p.at)}）</h3>${(p.misses || []).length ? `<ul class="bk-feed">${p.misses.map(x => `<li>${E(x)}</li>`).join('')}</ul>` : '<p class="bk-muted">這一局沒有答錯。</p>'}
      <div class="bk-row" style="margin-top:12px">${T.del === p.id ? `<span>確定刪除這一局？</span><button class="bk-b r" type="button" id="bk-dy">刪除</button><button class="bk-b g" type="button" id="bk-dn">取消</button>` : '<button class="bk-b g" type="button" id="bk-del">刪除這一局紀錄</button>'}</div></div>`;
    det.querySelectorAll('tr[data-p]').forEach(tr => tr.onclick = () => { T.play = tr.dataset.p; T.del = null; refresh(); });
    const dl = det.querySelector('#bk-del'); if (dl) dl.onclick = () => { T.del = p.id; refresh(); };
    const dn = det.querySelector('#bk-dn'); if (dn) dn.onclick = () => { T.del = null; refresh(); };
    const dy = det.querySelector('#bk-dy'); if (dy) dy.onclick = async () => { try { await ENV.db.collection('results').doc(p.id).delete(); } catch (e) { /* ignore */ } T.del = null; T.play = null; };
  }

  function importCard() {
    const el = $o('bk-imp'); if (!el) return;
    el.innerHTML = `<div class="bk-card"><h2>匯入代碼</h2><p class="bk-muted" style="margin:0 0 6px">用不是老師帳號的裝置玩完，會拿到一串代碼，貼在這裡就會存進後台。</p>
      <textarea class="bk-code" id="bk-ta" placeholder="把學生傳來的代碼貼在這裡（可以一次貼很多筆）" aria-label="貼上代碼"></textarea>
      <div class="bk-row" style="margin-top:8px"><button class="bk-b" type="button" id="bk-im">匯入</button></div><div class="bk-muted" id="bk-imsg" style="white-space:pre-wrap;margin-top:6px">${E(T.msg)}</div></div>`;
    el.querySelector('#bk-im').onclick = async () => {
      const ta = el.querySelector('#bk-ta'), msg = el.querySelector('#bk-imsg');
      const codes = findCodes(ta.value); if (!codes.length) { msg.textContent = '找不到代碼（以 EN 開頭、以 ~ 結尾，請整串複製）。'; return; }
      msg.textContent = '匯入中…'; let ok = 0, dup = 0; const bad = [];
      for (let i = 0; i < codes.length; i++) {
        try { const p = sanitize(await decodeCode(codes[i])); if (RS.docs.some(x => x.id === p.id)) { dup++; continue; } p.imported = true; await ENV.db.collection('results').doc(p.id).set(p); ok++; }
        catch (e) { const m = (e && e.message) || ''; bad.push('第 ' + (i + 1) + ' 筆：' + (/[一-鿿]/.test(m) ? m : '代碼不完整或已損壞')); }
      }
      T.msg = '匯入 ' + ok + ' 筆' + (dup ? '，' + dup + ' 筆已存在略過' : '') + '。' + (bad.length ? '\n' + bad.join('\n') : ''); msg.textContent = T.msg; if (ok) ta.value = '';
    };
  }

  /* ---------- 試玩工具列：內容由各遊戲的 window.BK_TEST() 提供 ---------- */
  let tbar = null, topen = true;
  function testBar(open) {
    if (open != null) topen = open;
    if (!TEST) { if (tbar) tbar.remove(); tbar = null; return; }
    if (!tbar) { tbar = document.createElement('div'); tbar.className = 'bk-tbar'; document.body.appendChild(tbar); }
    const groups = (window.BK_TEST && window.BK_TEST()) || [];
    tbar.innerHTML = `<div class="hd"><button class="pill" type="button" data-t="tog">🧪 試玩工具 ${topen ? '▼' : '▲'}</button><button class="pill x" type="button" data-t="end">結束試玩</button></div>
      ${topen ? `<div class="body">${groups.map((g, gi) => `<h4>${E(g.title)}</h4>${g.note ? `<div class="note">${E(g.note)}</div>` : ''}<div class="row">${(g.items || []).map((it, ii) => it.options
        ? `<select data-g="${gi}" data-i="${ii}" aria-label="${E(it.label)}"><option value="">${E(it.label)}</option>${it.options.map(o => `<option value="${E(o[0])}">${E(o[1])}</option>`).join('')}</select>`
        : `<button type="button" data-g="${gi}" data-i="${ii}" class="${it.on ? 'on' : ''}">${E(it.label)}</button>`).join('')}</div>`).join('')}<div class="note">試玩的局不會記錄成績。</div></div>` : ''}`;
    tbar.querySelector('[data-t="tog"]').onclick = () => testBar(!topen);
    tbar.querySelector('[data-t="end"]').onclick = () => { TEST = false; testBar(); if (window.BK_TEST_END) window.BK_TEST_END(); };
    tbar.querySelectorAll('button[data-g]').forEach(b => b.onclick = async () => { const it = groups[+b.dataset.g].items[+b.dataset.i]; try { await it.fn(); } catch (e) { console.warn(e); } testBar(it.close ? false : undefined); });
    tbar.querySelectorAll('select[data-g]').forEach(sel => sel.onchange = async () => { if (!sel.value) return; const it = groups[+sel.dataset.g].items[+sel.dataset.i]; try { await it.fn(sel.value); } catch (e) { console.warn(e); } testBar(it.close ? false : undefined); });
  }

  boot();
  return { get testing() { return TEST; }, refreshTest: () => testBar(), lock, liveStart, liveSet, liveAnswer, liveEnd, saveResult, codeBox, get owner() { return ENV.owner; }, _ENV: ENV, _sanitize: sanitize, _decode: decodeCode, _encode: encodeCode };
})();

    bad: () => P(t => tone(240, t, .25, 'sawtooth', .1, fx, 160)),

    tick: () => P(t => tone(1500, t, .04, 'sine', .12)),
    whoosh: () => P(t => { noise(t, .3, .35, 900); tone(400, t, .28, 'sine', .1, fx, 1200); }),

let curAudio = null;
function play(id, btn) {

    try { if (curAudio) curAudio.pause(); } catch (e) {}

// slow, natural whole-word audio; lights the chunk buttons one by one while it plays
function playSlow(w, els) {
  return new Promise(res => {
    try { if (curAudio) curAudio.pause(); } catch (e) {}
    const a = new Audio('audio/' + w.id + '.mp3'); curAudio = a; SFX.duck(true);
    const parts = (CH[w.id] || []).filter(x => x.a), lens = parts.map(x => x.t.replace(/[\[\]]/g, '').length), tot = lens.reduce((x, y) => x + y, 0) || 1;
    let done = false, raf = 0;
    const light = i => els.forEach((e, k) => e.classList.toggle('lit', k === i));
    const end = () => { if (done) return; done = true; cancelAnimationFrame(raf); light(-1); SFX.duck(false); res(); };
    const step = () => {
      if (a.duration) {
        const f = Math.min(.999, Math.max(0, (a.currentTime - .1) / Math.max(.2, a.duration - .25)));
        let acc = 0, i = 0; while (i < lens.length - 1 && f > (acc + lens[i]) / tot) { acc += lens[i]; i++; }
        light(i);
      }
      raf = requestAnimationFrame(step);
    };
    a.onended = end; a.onerror = () => { end(); };
    a.play().then(() => { raf = requestAnimationFrame(step); }).catch(() => play(w.id).then(end));
    setTimeout(end, 7000);
  });
}

/* ---------- unit runner ---------- */
let RUN = null;

  stopAll(); SFX.ac(); SFX.startMusic();

  BK.liveStart({ name: save.name || '（未填姓名）', what: run.what, unit: u.id, score: 0 });
  for (let i = 0; i < stages.length; i++) {
    if (!run.alive) return;
    const key = stages[i];
    BK.liveSet({ stage: STAGE_INFO[key][1] + '（' + (i + 1) + '/' + stages.length + '）' });
    if (BK.testing) BK.refreshTest();
    app.innerHTML = `<div class="bar"><button class="back" id="quit" type="button">← 回首頁</button>
      <div class="dots">${stages.map((_, k) => `<i class="${k < i ? 'done' : k === i ? 'on' : ''}"></i>`).join('')}</div><span class="scorep" id="score">${run.score}</span></div>
      <div class="stage" id="stage"></div>`;
    $('#quit').onclick = () => unitMenu(u);
    const st = $('#stage');
    const [em, nm, hint] = STAGE_INFO[key];
    st.innerHTML = `<div class="splash"><div><div class="e">${em}</div><div class="n">${nm}</div><div class="h">${hint}</div></div></div>`;
    SFX.stage(); await sleep(1500); if (!run.alive) return;
    st.innerHTML = '';
    await Promise.race([GAMES[key](st, run), new Promise(r => { run.skip = r; })]);
    if (!run.alive) return;

  }
  finishUnit(run);
}

  return { truth, html: `${icon(w.icon)}<div class="w">${chunked(shown)}</div>`, fix: `${icon(w.icon)}<div class="w">${chunked(w)}</div><div style="font-weight:900;color:var(--mint)">✓ ${esc(w.zh)}</div>`, miss: label(w), say: w.id };
};
GAMES.tf = (st, run) => tfGame(st, run, tfVocab(run.u.pool()));
const tfGram = () => {
  const g = G[rnd(G.length)], truth = Math.random() < .5, wrong = g.o.filter(o => o !== g.a);
  const fill = truth || !wrong.length ? g.a : wrong[rnd(wrong.length)];
  const s = esc(g.q).replace('___', `<b style="color:var(--grape)">${esc(fill)}</b>`), good = esc(g.q).replace('___', `<b style="color:var(--mint)">${esc(g.a)}</b>`);
  return { truth: fill === g.a, html: `<div class="s">${s}</div>${g.zh ? `<div style="color:var(--ink2)">（${esc(g.zh)}）</div>` : ''}`, fix: `<div class="s">${good}</div><div style="color:var(--ink2)">💡 ${esc(g.hint)}</div>`, miss: g.q.replace('___', g.a) };
};
GAMES.tfgram = (st, run) => tfGame(st, run, tfGram, 40);
GAMES.tfphon = (st, run) => tfGame(st, run, () => {
  const w = pick(run.u.pool(), 1)[0], truth = Math.random() < .5, P = PH[w.grp][truth ? w.s : 1 - w.s];
  return { truth, audio: w.id, say: w.id, html: `${icon(w.icon)}<div class="w">${highlight(w)}</div><div style="font-size:24px;font-weight:900">畫線的是 <span style="color:${P.c}">${P.zh}</span> 嗎？</div>`,
    fix: `<div class="w">${highlight(w)}</div><div style="font-size:22px;font-weight:900">${esc(w.en)}：<span style="color:${snd(w).c}">${snd(w).zh}</span></div><div style="color:var(--ink2)">💡 ${snd(w).tip}</div>`, miss: `${w.en}：${snd(w).zh}` };
}, 40);
GAMES.tfmix = (st, run) => tfGame(st, run, () => Math.random() < .3 ? tfGram() : tfVocab(byCat(MIXCATS[rnd(MIXCATS.length)]))(), 45);

// 🧱 sentence blocks
const BLOCK_POOL = () => S.filter(s => s.en.split(' ').length >= 3 && s.id !== 's-late-for-school').map(s => s.id);
GAMES.blocks = (st, run) => new Promise(async done => {
  run.usedBlocks = run.usedBlocks || [];
  let left = BLOCK_POOL().filter(id => !run.usedBlocks.includes(id)); if (left.length < 5) { run.usedBlocks = []; left = BLOCK_POOL(); }
  const ids = pick(left, 5); run.usedBlocks.push(...ids);
  for (const id of ids) {
    if (!run.alive) return;
    const s = byId(id), words = s.en.split(' ');
    const cols = words.map((_, i) => COLORS[i % COLORS.length]);
    let order = shuffle(words.map((w, i) => i)); if (words.length > 1 && order.every((v, i) => v === i)) order.reverse();
    st.innerHTML = `<div class="ask"><div class="big" style="font-size:26px">${esc(s.zh)} ${speakBtn(id)}</div><div class="t">點積木，照順序排好</div></div>
      <div class="line" id="line"></div><div class="pool" id="pool">${order.map(i => `<button class="blk" type="button" data-i="${i}" style="background:${cols[i]}">${esc(words[i])}</button>`).join('')}</div>
      <div class="hint">點上面排好的積木可以拿回來</div>`;
    bindSpeak(st);
    await new Promise(next => {
      const line = $('#line'), pool = $('#pool'); let tries = 0;
      const check = () => {
        if (pool.children.length) return;
        const got = [...line.children].map(b => words[+b.dataset.i]).join(' ');
        if (got === s.en) {
          line.classList.add('ok'); hit(run, true); const [x, y] = centerOf(line); confetti(x, y, 24); play(id); setTimeout(next, 1700);
        } else {
          tries++; line.classList.remove('no'); void line.offsetWidth; line.classList.add('no'); hit(run, false, s.en + '　' + s.zh, id);
          setTimeout(() => {
            line.classList.remove('no');
            // keep the correct start, send the rest back
            const kids = [...line.children]; let k = 0; while (k < kids.length && words[+kids[k].dataset.i] === words[k]) k++;
            kids.slice(k).forEach(b => pool.appendChild(b));
            if (tries >= 2 && k < words.length) { const nb = [...pool.children].find(b => words[+b.dataset.i] === words[k]); if (nb) { nb.style.outline = '4px solid var(--sun)'; } }
          }, 700);
        }
      };
      st.onclick = e => {
        const b = e.target.closest('.blk'); if (!b) return; SFX.flip(); b.style.outline = '';
        (b.parentElement === pool ? line : pool).appendChild(b); check();
      };
    });
  }
  done();
});

// 🧺 phonics sorting
GAMES.sort = (st, run) => new Promise(async done => {
  const all = run.u.pool(), ws = shuffle(['th', 'c', 'g'].flatMap(g => pick(all.filter(x => x.grp === g), 3)));
  for (const w of ws) {
    if (!run.alive) return;
    st.innerHTML = `<div class="ask"><div class="t">聽一聽，畫線的字母怎麼唸？丟進對的籃子</div></div>
      <div class="sortcard" id="sc">${icon(w.icon)}<div class="w">${highlight(w)}</div><div style="color:var(--ink2)">${esc(w.zh)}</div>${speakBtn(w.id)}</div>
      <div class="baskets" style="grid-template-columns:repeat(2,minmax(0,1fr))">${PH[w.grp].map((P, k) => `<button class="basket" type="button" data-g="${k}" style="background:${P.c}"><b>🧺 ${P.zh}</b><span>${P.ex}</span></button>`).join('')}</div>`;
    bindSpeak(st); play(w.id);
    await new Promise(next => st.querySelectorAll('.basket').forEach(b => b.onclick = () => {
      if (+b.dataset.g === w.s) {
        $('#sc').classList.add('fly'); SFX.pop(); hit(run, true); const [x, y] = centerOf(b); confetti(x, y, 14); setTimeout(next, 600);
      } else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); hit(run, false, `${w.en}：${snd(w).zh}`, w.id); bubble(st, ...centerOf(b), `💡 ${snd(w).tip}`, false); }
    }));
  }
  done();
});

// 📝 mock exam: 15 questions, exam-like formats, score out of 100
GAMES.exam = (st, run) => new Promise(async done => {
  const vocab = MIXCATS.flatMap(byCat);
  const qs = shuffle([
    ...pick(vocab, 4).map(w => ({ kind: 'listen', w })), ...pick(vocab, 3).map(w => ({ kind: 'zhen', w })),
    ...pick(phonPool(), 3).map(w => ({ kind: 'phon', w })), ...pick(G, 3).map(g => ({ kind: 'gram', g })), ...pick(S, 2).map(s => ({ kind: 'sent', s })),
  ]);
  let right = 0;
  for (let n = 0; n < qs.length; n++) {
    if (!run.alive) return;
    const q = qs[n]; let ask = '', opts = [], ans = '', audio = null, miss = '', say = null;
    if (q.kind === 'listen') { const os = shuffle([q.w, ...pick(byCat(q.w.cat).filter(x => x !== q.w), 3)]); audio = say = q.w.id; ask = `<div class="t">聽一聽，選出正確的圖</div>${speakBtn(q.w.id)}`; opts = os.map(o => [o.id, icon(o.icon)]); ans = q.w.id; miss = label(q.w); }
    if (q.kind === 'zhen') { const os = shuffle([q.w, ...pick(byCat(q.w.cat).filter(x => x !== q.w), 3)]); ask = `<div class="t">這個的英文是？</div><div class="big">${icon(q.w.icon)}${esc(q.w.zh)}</div>`; opts = os.map(o => [o.id, `<span class="en">${esc(o.en)}</span>`]); ans = q.w.id; miss = label(q.w); say = q.w.id; }
    if (q.kind === 'phon') { audio = say = q.w.id; ask = `<div class="t">這個字畫線的字母怎麼唸？</div><div class="big">${icon(q.w.icon)}<span class="en">${highlight(q.w)}</span>${speakBtn(q.w.id)}</div>`; opts = PH[q.w.grp].map((P, k) => [String(k), P.zh]); ans = String(q.w.s); miss = `${q.w.en}：${snd(q.w).zh}`; }
    if (q.kind === 'gram') { ask = `<div class="t">選出正確的字</div><div class="sent">${esc(q.g.q).replace('___', '<u>？</u>')}</div>${q.g.zh ? `<div class="t">${esc(q.g.zh)}</div>` : ''}`; opts = shuffle(q.g.o).map(o => [o, `<span class="en">${esc(o)}</span>`]); ans = q.g.a; miss = q.g.q.replace('___', q.g.a); }
    if (q.kind === 'sent') { const os = shuffle([q.s, ...pick(S.filter(x => x !== q.s), 3)]); audio = say = q.s.id; ask = `<div class="t">聽句子，選出中文意思</div>${speakBtn(q.s.id)}`; opts = os.map(o => [o.id, `<span style="font-size:19px">${esc(o.zh)}</span>`]); ans = q.s.id; miss = `${q.s.en}＝${q.s.zh}`; }
    st.innerHTML = `<div style="text-align:center;font-weight:900;color:var(--ink2);margin-bottom:6px">第 ${n + 1} / ${qs.length} 題</div><div class="ask">${ask}</div>
      <div class="opts" ${opts.length === 3 ? 'style="grid-template-columns:repeat(3,minmax(0,1fr))"' : ''}>${opts.map(([k, h]) => `<button class="opt" type="button" data-k="${esc(k)}">${h}</button>`).join('')}</div>`;
    bindSpeak(st); if (audio) play(audio);
    await new Promise(next => st.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      st.querySelectorAll('.opt').forEach(x => { x.onclick = null; if (x.dataset.k === ans) x.classList.add('ok'); });
      const ok = b.dataset.k === ans; if (!ok) b.classList.add('no'); else right++;
      hit(run, ok, miss, say); setTimeout(next, ok ? 700 : 1600);
    }));
  }
  run.exam = Math.round(right / qs.length * 100);
  save.best.exam = Math.max(save.best.exam || 0, run.exam); persist();
  done();
});

/* ---------- 老師試玩模式的工具（只有老師帳號、輸入後台密碼後才看得到） ---------- */
function soundCheck() {
  const KEYM = 'hjr-sound-marks'; let marks = {}; try { marks = JSON.parse(localStorage.getItem(KEYM) || '{}'); } catch (e) {}
  const seen = new Set(); const items = UNITS.slice(0, 6).filter(u => u.pool).flatMap(u => u.pool().filter(w => !seen.has(w.id) && seen.add(w.id)).map(w => ({ id: w.id, en: w.en, zh: w.zh, w, grp: u.name }))).concat(S.map(x => ({ id: x.id, en: x.en, zh: x.zh, grp: '句子' })));
  const m = document.createElement('div'); m.className = 'tmod';
  let stop = true;
  const render = () => {
    const bad = items.filter(i => marks[i.id]);
    m.innerHTML = `<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:20px">🧪 檢查發音（${items.length} 個）</b>
      <span><button class="btn" type="button" id="sca" style="font-size:16px;padding:8px 14px">▶ 依序播放全部</button> <button class="btn alt" type="button" id="scx" style="font-size:16px;padding:8px 14px">關閉</button></span></div>
      <div style="color:var(--ink2);font-size:14px">聽起來怪怪的字，按「怪怪的」標起來。下面會整理成一段文字，複製傳給我就能換掉。</div>
      ${items.map(i => `<div class="wr ${marks[i.id] ? 'bad' : ''}" data-id="${i.id}"><span><b>${i.w ? chunked(i.w) : esc(i.en)}</b> <span style="color:var(--ink2)">${esc(i.zh)}・${esc(i.grp)}</span></span>${speakBtn(i.id)}<button class="mk" type="button" data-m="${i.id}">${marks[i.id] ? '已標記' : '怪怪的'}</button></div>`).join('')}
      <div style="background:#fff6dc;border-radius:12px;padding:10px"><b>標記的字（${bad.length}）：</b><div id="scl" style="margin-top:4px;user-select:text">${bad.length ? esc('這些字的發音怪怪的：' + bad.map(i => i.en).join('、')) : '還沒有標記'}</div></div></div>`;
    bindSpeak(m);
    m.querySelector('#scx').onclick = () => { stop = true; m.remove(); };
    m.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const id = b.dataset.m; if (marks[id]) delete marks[id]; else marks[id] = 1; try { localStorage.setItem(KEYM, JSON.stringify(marks)); } catch (e) {} const y = m.querySelector('.box').scrollTop; render(); m.querySelector('.box').scrollTop = y; });
    m.querySelector('#sca').onclick = async () => {
      if (!stop) { stop = true; return; } stop = false; m.querySelector('#sca').textContent = '⏸ 停止';
      for (const i of items) { if (stop) break; const row = m.querySelector(`[data-id="${i.id}"]`); m.querySelectorAll('.wr').forEach(r => r.classList.toggle('now', r === row)); if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' }); await play(i.id); await sleep(600); }
      stop = true; const b = m.querySelector('#sca'); if (b) b.textContent = '▶ 依序播放全部';
    };
  };
  render(); document.body.appendChild(m); SFX.ac();
}
window.BK_TEST = () => {
  const g = [{ title: '直接玩某一關的某個小遊戲', items: [{ label: '選一個…', options: UNITS.flatMap((u, k) => [...new Set(u.stages)].map(key => [k + '|' + key, (k + 1) + '. ' + u.name + '・' + STAGE_INFO[key][1]])), close: true, fn: v => { const [k, key] = v.split('|'); runUnit(UNITS[+k], key); } },
    { label: '直接考模擬考', close: true, fn: () => runUnit(UNITS[6], 'exam') }] }];
  if (RUN && RUN.alive) g.push({ title: '正在玩：' + RUN.what, items: [{ label: '⏭ 跳過這一站', fn: () => RUN.skip && RUN.skip() }, { label: '直接結算這一關', fn: () => finishUnit(RUN) }] });
  g.push({ title: '檢查發音', note: '所有單字和句子依序播放，怪怪的可以標記起來。', items: [{ label: '打開發音檢查', fn: soundCheck }] });
  return g;
};
window.BK_TEST_END = () => { stopAll(); home(); };

/* ---------- dictionary ---------- */
const dict = $('#dict'), dq = $('#dictq'), dl = $('#dictlist');
const DICT = [...W.map(w => ({ id: w.id, en: w.en, zh: w.zh, w })), ...S.map(s => ({ id: s.id, en: s.en, zh: s.zh }))];
function renderDict() {
  const q = dq.value.trim().toLowerCase();
  const list = q ? DICT.filter(d => d.en.toLowerCase().includes(q) || d.zh.includes(q)) : DICT;
  dl.innerHTML = list.length ? list.map(d => `<li><div><b>${d.w ? chunked(d.w) : esc(d.en)}</b><span>${esc(d.zh)}</span></div>${speakBtn(d.id)}</li>`).join('') : `<li><span>找不到「${esc(dq.value)}」，試試 天氣、music</span></li>`;
  bindSpeak(dl);
}
function openDict() { dict.hidden = false; renderDict(); setTimeout(() => dq.focus(), 50); }
$('#dictclose').onclick = () => dict.hidden = true;
dict.onclick = e => { if (e.target === dict) dict.hidden = true; };
dq.oninput = renderDict;

home();
</script>
