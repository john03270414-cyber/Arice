<title>南一數學大富翁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 數學大富翁：棋盤遊戲版面。深藍墨色、薄荷灰棋盤、六色事件格。 */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#14213D; --muted:#55627A; --line:#CBD6D2;
  --accent:#2457E6; --accent-ink:#FFFFFF; --accent-soft:#E3EBFF; --mark:#FFE585;
  --good:#0F7A46; --good-soft:#DDF3E7; --bad:#B3261E; --bad-soft:#FBE4E1; --warn:#7A4F00; --warn-soft:#FFF1CC;
  --board:#D9E7E1; --token:#E8590C; --token-ink:#FFFFFF; --token2:#0E7C86; --token2-ink:#FFFFFF;
  --t-s-bg:#14213D; --t-s-ink:#FFFFFF; --t-b-bg:#D4F0E0; --t-b-ink:#0B5A33; --t-p-bg:#FADAD6; --t-p-ink:#8C1D17;
  --t-c-bg:#FFEFB8; --t-c-ink:#6B4300; --t-h-bg:#E6D9FB; --t-h-ink:#47258A; --t-a-bg:#CBEDF3; --t-a-ink:#0B5563; --t-n-bg:#FFFFFF; --t-n-ink:#6A7690;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1524; --surface:#162033; --ink:#E8EDF6; --muted:#9BA7BD; --line:#2A3752;
  --accent:#7BA3FF; --accent-ink:#0A1226; --accent-soft:#1E2B4D; --mark:#6B5A12;
  --good:#52C890; --good-soft:#12301F; --bad:#FF8479; --bad-soft:#3A1A19; --warn:#E6B550; --warn-soft:#3A2D0C;
  --board:#1B2A3A; --token:#FF9A5C; --token-ink:#1A0E05; --token2:#5CD6D0; --token2-ink:#04201F;
  --t-s-bg:#E8EDF6; --t-s-ink:#14213D; --t-b-bg:#12301F; --t-b-ink:#8EE5B7; --t-p-bg:#3A1A19; --t-p-ink:#FFB3AC;
  --t-c-bg:#3A2D0C; --t-c-ink:#F6D58A; --t-h-bg:#2B1F4D; --t-h-ink:#CDB8FF; --t-a-bg:#0F3138; --t-a-ink:#9BE3EE; --t-n-bg:#1D2A41; --t-n-ink:#9BA7BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#162033; --ink:#E8EDF6; --muted:#9BA7BD; --line:#2A3752;
  --accent:#7BA3FF; --accent-ink:#0A1226; --accent-soft:#1E2B4D; --mark:#6B5A12;
  --good:#52C890; --good-soft:#12301F; --bad:#FF8479; --bad-soft:#3A1A19; --warn:#E6B550; --warn-soft:#3A2D0C;
  --board:#1B2A3A; --token:#FF9A5C; --token-ink:#1A0E05; --token2:#5CD6D0; --token2-ink:#04201F;
  --t-s-bg:#E8EDF6; --t-s-ink:#14213D; --t-b-bg:#12301F; --t-b-ink:#8EE5B7; --t-p-bg:#3A1A19; --t-p-ink:#FFB3AC;
  --t-c-bg:#3A2D0C; --t-c-ink:#F6D58A; --t-h-bg:#2B1F4D; --t-h-ink:#CDB8FF; --t-a-bg:#0F3138; --t-a-ink:#9BE3EE; --t-n-bg:#1D2A41; --t-n-ink:#9BA7BD; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px}
h1,h2,h3{font-weight:900;line-height:1.3;margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 頂列 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{font-weight:900;font-size:20px;letter-spacing:.03em}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wrap.ingame>.top{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card + .card{margin-top:14px}
.note{border-radius:12px;padding:12px 14px;background:var(--accent-soft);font-size:15px}
.note.good{background:var(--good-soft);color:var(--good)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.err{color:var(--bad);font-size:14px;min-height:1.5em;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 24px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.text{width:100%;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg)}
.text:focus{border-color:var(--accent);outline:none}

/* 開始頁 */
.hero{display:grid;gap:16px}
@media (min-width:820px){.hero{grid-template-columns:1.1fr 1fr;align-items:start}}
.hero h1{font-size:32px;margin-bottom:6px}
.hero .sub{color:var(--muted);margin:0 0 4px}
.field{display:grid;gap:6px;margin-top:16px}
.field label{font-weight:700;font-size:15px}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;font-size:15px;line-height:1.5}
.mini{display:flex;align-items:center;justify-content:center;height:34px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid var(--line)}

/* 遊戲 */
.game{display:grid;gap:14px}
@media (min-width:900px){.game{grid-template-columns:minmax(0,560px) minmax(0,1fr);align-items:start}}
.boardwrap{width:100%;max-width:560px;margin-inline:auto}
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:4px;aspect-ratio:1;background:var(--board);border-radius:20px;padding:6px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-weight:700;font-size:clamp(10px,2.7vw,14px);line-height:1.15;text-align:center;min-width:0;border:1px solid transparent}
.tile small{font-size:.78em;font-weight:500;opacity:.85}
.tile.s{background:var(--t-s-bg);color:var(--t-s-ink)}
.tile.b{background:var(--t-b-bg);color:var(--t-b-ink);border-color:currentColor}
.tile.p{background:var(--t-p-bg);color:var(--t-p-ink);border-color:currentColor}
.tile.c{background:var(--t-c-bg);color:var(--t-c-ink);border-color:currentColor}
.tile.h{background:var(--t-h-bg);color:var(--t-h-ink);border-color:currentColor}
.tile.a{background:var(--t-a-bg);color:var(--t-a-ink);border-color:currentColor}
.tile.n{background:var(--t-n-bg);color:var(--t-n-ink);border-color:var(--line);font-weight:500}
.tile.here{box-shadow:0 0 0 3px var(--accent)}
.token{position:absolute;top:0;bottom:0;left:0;right:0;margin:auto;width:62%;aspect-ratio:1;height:auto;border-radius:50%;background:var(--token);color:var(--token-ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(12px,3.4vw,18px);box-shadow:0 2px 0 rgba(0,0,0,.28),0 0 0 3px var(--surface);z-index:2;animation:hop .24s ease-out}
.token.still{animation:none}
.token.opp{background:var(--token2);color:var(--token2-ink);width:54%}
.token.two{width:46%}
.token.two.me{right:auto;left:5%}
.token.two.opp{left:auto;right:5%}
@keyframes hop{0%{transform:translateY(-35%) scale(1.1)}60%{transform:translateY(6%)}100%{transform:none}}
.hub{grid-area:2/2/7/7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:4px;min-width:0}
.score{font-family:var(--f-mono);font-weight:500;font-size:clamp(34px,9vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.score small{font-family:var(--f-body);font-size:.34em;color:var(--muted);margin-left:4px}
.meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.meta{align-items:center}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;border:2px solid var(--line);border-radius:999px;padding:0 10px;background:var(--surface);color:var(--ink)}
.timer.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.timer.late{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:24px}
.badge{font-size:12px;border-radius:999px;padding:0 9px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.badge.on{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.die{width:clamp(52px,14vw,68px);height:clamp(52px,14vw,68px);border-radius:16px;border:3px solid var(--ink);background:var(--surface);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;gap:2px;flex:none;position:relative}
.die i{border-radius:50%;background:var(--ink);transform:scale(0);width:100%;height:100%}
.die i.on{transform:scale(.82)}
button.die:disabled{opacity:.5;cursor:default}
button.die.ready{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 1.2s ease-in-out infinite}
.die.roll{animation:shake .12s linear infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--accent-soft)}}
@keyframes shake{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}100%{transform:rotate(-7deg)}}
.hubhint{font-size:13px;color:var(--muted);min-height:1.4em}

/* 題目與回饋 */
.panel{min-width:0}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:12.5px;border-radius:999px;padding:1px 10px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.tag.chal{background:var(--t-h-bg);color:var(--t-h-ink);border-color:transparent;font-weight:700}
.stem{font-size:19px;line-height:1.95;margin:4px 0 12px}
.clue{padding:0 .08em;border-radius:3px}
.reveal .clue{background:var(--mark);color:var(--ink);font-weight:700}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;line-height:1.2;font-size:.92em}
.fr>i{font-style:normal;padding:0 .22em}
.fr>i:first-child{border-bottom:2px solid currentColor;padding-bottom:.06em}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 14px;text-align:left;font-size:17px;line-height:1.5;width:100%}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:14px;background:var(--surface)}
.opt .ot{flex:1;min-width:0}
.opt .lab{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:0 9px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .ltr{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .lab{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .lab{background:var(--bad);color:var(--surface)}
.opt.gone{opacity:.45;text-decoration:line-through}
.opt:disabled{cursor:default}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px}
.fb.ok{background:var(--good-soft);border:2px solid var(--good)}
.fb.ng{background:var(--bad-soft);border:2px solid var(--bad)}
.fb h3{font-size:19px;margin-bottom:4px}
.fb p{margin:4px 0}
.ev{border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.ev h3{font-size:20px;margin-bottom:4px}
.ev.b{background:var(--t-b-bg);border-color:var(--t-b-ink);color:var(--t-b-ink)}
.ev.p{background:var(--t-p-bg);border-color:var(--t-p-ink);color:var(--t-p-ink)}
.ev.c{background:var(--t-c-bg);border-color:var(--t-c-ink);color:var(--t-c-ink)}
.ev.h{background:var(--t-h-bg);border-color:var(--t-h-ink);color:var(--t-h-ink)}
.ev.a{background:var(--t-a-bg);border-color:var(--t-a-ink);color:var(--t-a-ink)}
.ev p{margin:2px 0;color:var(--ink)}
.log{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.log li b{font-family:var(--f-mono);font-weight:500}
.pos{color:var(--good)}.neg{color:var(--bad)}

/* 結果 */
.bigscore{font-family:var(--f-mono);font-size:56px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:22px;display:block;line-height:1.3}
.stat span{font-size:13px;color:var(--muted)}
.rv{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);margin-top:12px}
.rv .stem{font-size:17px;line-height:1.9;margin:4px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.pill.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.ng{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.codebox{width:100%;min-height:96px;border:2px dashed var(--line);border-radius:10px;padding:10px;font:12px/1.5 var(--f-mono);background:var(--bg);word-break:break-all}

/* 老師 */
.wrap.wide{max-width:1080px}
.grid2{display:grid;gap:14px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.table th{font-size:13px;color:var(--muted);font-weight:500}
.table td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.table tr[aria-selected="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.scroll{overflow-x:auto}
.meter{display:grid;grid-template-columns:minmax(7em,12em) minmax(3em,1fr) auto;gap:10px;align-items:center;margin:6px 0;font-size:14.5px}
.meter .bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:7px}
.meter .bar i.lo{background:var(--bad)}
.meter .bar i.mid{background:var(--warn)}
.meter .bar i.hi{background:var(--good)}
.meter .v{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.confirm{border:2px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:14px;margin-top:14px}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.stem{font-size:18px}.hero h1{font-size:27px}.opt{font-size:16px}}

/* ===== 題型選擇、計算題輸入、音效鈕 ===== */
.seg{flex-wrap:wrap}
.seg .tab{min-height:44px;padding:8px 20px;font-size:16px}
.tag.calc{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}
.snd[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.hubsnd{padding:2px 12px;font-size:12px;min-height:28px}
.ans{margin:6px 0 10px;display:flex;justify-content:center}
.disp{display:flex;align-items:center;justify-content:center;gap:10px;min-width:min(100%,320px);min-height:66px;border:2px solid var(--accent);border-radius:14px;background:var(--bg);padding:8px 16px}
.disp .val{font-family:var(--f-mono);font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.disp .val::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;background:var(--accent);vertical-align:-.12em;animation:blink 1s steps(1) infinite}
.disp .unit{font-size:18px;color:var(--muted)}
.ph{color:var(--muted);font-size:17px;opacity:.8}
@keyframes blink{50%{opacity:0}}
.fdisp{display:flex;flex-direction:column;align-items:center;gap:6px}
.fbox{display:flex;align-items:center;justify-content:center;min-width:140px;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-family:var(--f-mono);font-size:30px;padding:2px 14px;font-variant-numeric:tabular-nums}
.fbox.on{border-color:var(--accent);background:var(--accent-soft)}
.fbar{width:170px;height:3px;background:var(--ink);border-radius:2px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:0 auto}
.key{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-family:var(--f-mono);font-size:26px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.key:active{background:var(--accent-soft);border-color:var(--accent)}
.key.fn{font-family:var(--f-body);font-size:18px;background:var(--bg)}
.pad+.acts{justify-content:center}

function fmtD(v, k) { const neg = v < 0; v = Math.abs(v); const s = String(v).padStart(k + 1, '0'); const ip = s.slice(0, s.length - k), fp = s.slice(s.length - k).replace(/0+$/, ''); return (neg ? '-' : '') + ip + (fp ? '.' + fp : ''); }
const numAns = (str, u) => ({ t: 'num', v: Number(str), u: u || '' });
function mkc(stem, ans, why, meta) { return { kind: 'c', stem, ans, why, meta: meta || {} }; }
function ansText(a) { return a.t === 'frac' ? a.n + '/' + a.d : String(a.v) + (a.u ? ' ' + a.u : ''); }
function parseNum(s) { s = String(s == null ? '' : s).normalize('NFKC').trim().replace(/[,，\s]/g, ''); if (!/^\d+\.?\d*$/.test(s) || s.length > 14) return NaN; return Number(s); }
function cgrade(q, inp) {
  const a = q.ans; if (!inp) return false;
  if (a.t === 'num') { const x = parseNum(inp.s); return isFinite(x) && Math.abs(x - a.v) < 1e-9; }
  const n = parseNum(inp.n), d = parseNum(inp.d);
  if (!isFinite(n) || !isFinite(d) || n % 1 || d % 1 || d <= 0) return false;
  return n * a.d === d * a.n && (!a.simp || gcd(n, d) === 1);
}
function cText(a, inp) { if (!inp) return ''; return a.t === 'frac' ? String(inp.n || '').slice(0, 8) + '/' + String(inp.d || '').slice(0, 8) : String(inp.s || '').slice(0, 20); }

/* =========================================================

/* chips：所有數字（會由小到大排好）；good：正確要勾的數字 */
function mks(stem, chips, good, why, meta) {
  const items = chips.slice().sort((a, b) => a - b);
  if (new Set(items).size !== items.length) throw new Error('勾選題數字重複：' + items.join(','));
  const ans = []; items.forEach((v, i) => { if (good.indexOf(v) >= 0) ans.push(i); });

/* =========================================================
   抽題
   ========================================================= */
function build(g, r, pub) {
  const q = g.fn(r);
  q.kind = g.kind || 'j'; q.u = null; q.t = g.tier; q.g = g.id; q.skill = g.skill; q.tag = tagOf(g, pub);
  q.text = plain(q.stem); q.clues = clues(q.stem);
  return q;
}
function poolFor(pub, unit, tier, kind) { const L = kind === 'c' ? CGEN : GEN; return L.filter(g => g.units.indexOf(unit) >= 0 && g.pubs.indexOf(pub) >= 0 && (!tier || g.tier === tier)); }

/* 出題器：平均輪流單元、避免重複題型。kind：'j' 判斷題、'c' 計算題 */
function makeDeck(pub, seed, kind) {
  kind = kind === 'c' ? 'c' : 'j';
  const r = mkrng(seed); const units = PUBS[pub].units.map(u => u.id);
  const used = new Set(); const asked = {}; units.forEach(u => (asked[u] = 0));
  return {
    next(opts) {
      opts = opts || {}; const minC = Math.min.apply(null, units.map(u => asked[u]));
      const cand = units.filter(u => asked[u] === minC); const u = r.pick(cand);
      let tier = opts.tier || (opts.turn < 3 ? 'B' : (r.chance(0.4) ? 'M' : 'B'));
      let pool = poolFor(pub, u, tier, kind).filter(g => !used.has(g.id));
      if (!pool.length) pool = poolFor(pub, u, tier, kind);
      if (!pool.length) pool = poolFor(pub, u, null, kind);
      const fresh = pool.filter(g => !used.has(g.id)); const base = fresh.length ? fresh : pool;
      const g = r.pick(kind === 'j' ? base.concat(base.filter(x => x.kind === 's')) : base); /* 勾選題多放一份，出現機率拉高 */
      used.add(g.id); asked[u]++;
      const q = build(g, r, pub); q.u = u; return q;
    },
  };
}

/* =========================================================
   小遊戲：把一題變成「遊戲物件」
   判斷題 → 4 個物件 A–D（選項文字列在題目旁邊）
   計算題 → 正確答案 + 3 個干擾的數字／分數（算錯常見的樣子）
   勾選題 → 6–8 個數字，符合的全部都要拿到
   ========================================================= */
const decOf = x => (String(x).split('.')[1] || '').length;
function calcRound(q, r) {
  const a = q.ans; let right, wrong = [], val;

    for (let k = 1; k <= 9; k++) cand.push([a.n + k, a.d + k + 1]);
    const rk = (n, d) => { const g = gcd(n, d); return (n / g) + '/' + (d / g); };      // 約到最簡，值相同的只留一個
    const seen = new Set([rk(a.n, a.d)]);
    const ok = c => c[0] >= 1 && c[1] >= 2 && c[0] <= 99 && c[1] <= 99 && !seen.has(rk(c[0], c[1]));
    const near = [];
    for (const c of cand) { if (ok(c)) { seen.add(rk(c[0], c[1])); near.push(c[0] + '/' + c[1]); } }
    wrong = r.shuffle(near.slice(0, 6)).slice(0, 3);
    if (wrong.length < 3) near.slice(6).forEach(x => { if (wrong.length < 3) wrong.push(x); });
    const value = s => { const p = s.split('/'); return Number(p[0]) / Number(p[1]); };
    const labels = [right].concat(wrong).sort((x, y) => value(x) - value(y));
    return { many: false, labels, good: [labels.indexOf(right)], panel: null };
  }
  val = a.v; const k = decOf(val), st = Math.pow(10, -k), fix = x => Number(x.toFixed(k + 2));
  right = String(val);
  const cand = [val + st, val - st, val + 2 * st, val - 2 * st, val + 10 * st, val - 10 * st, val * 10, val / 10, val * 2, val / 2, val + 1, val - 1, val + 3 * st, val - 3 * st, val + 100 * st, val * 3].map(fix);
  const seen = new Set([right]); const near = [];
  for (const x of cand) { const s = String(x); if (x > 0 && isFinite(x) && decOf(x) <= k && s.length <= 8 && !seen.has(s)) { seen.add(s); near.push(s); } }
  wrong = r.shuffle(near.slice(0, 6)).slice(0, 3);
  if (wrong.length < 3) near.slice(6).forEach(x => { if (wrong.length < 3) wrong.push(x); });
  for (let j = 1; wrong.length < 3 && j < 50; j++) { const s = String(fix(val + (j + 3) * st)); if (!seen.has(s) && decOf(Number(s)) <= k) { seen.add(s); wrong.push(s); } }
  const labels = [right].concat(wrong).sort((x, y) => Number(x) - Number(y));
  return { many: false, labels, good: [labels.indexOf(right)], panel: null };
}
function roundOf(q, r) {
  r = r || mkrng(1);
  if (q.kind === 's') return { many: true, labels: q.items.slice(), good: q.ans.slice(), panel: null };
  if (q.kind === 'c') return calcRound(q, r);
  const n = q.opts.length; return { many: false, labels: 'ABCD'.slice(0, n).split(''), good: [q.ans], panel: q.opts.slice() };
}

const API = { gcd, lcm, mkrng, PUBS, GEN, CGEN, plain, clues, makeDeck, poolFor, build, tagOf, mk, cgrade, cText, ansText, parseNum, fmtD, sgrade, sText, roundOf };

async function createRoom(name, dur, qm) {

  try {
    const snap = await ENV.db.collection('battles').get(); const old = Date.now() - 12 * 3600e3; const used = new Set();

      if (v.at < old) { try { await ENV.db.doc('battles/' + d.id).delete(); await ENV.db.doc('bplayers/' + d.id + '_h').delete(); await ENV.db.doc('bplayers/' + d.id + '_g').delete(); await ENV.db.doc('bsync/' + d.id + '_h').delete(); await ENV.db.doc('bsync/' + d.id + '_g').delete(); used.delete(d.id); } catch (e) { /* 清不掉就算了 */ } }
    }
    let code; do { code = String(1000 + Math.floor(Math.random() * 9000)); } while (used.has(code));
    const seed = newSeed();
    try { await ENV.db.doc('bsync/' + code + '_h').delete(); await ENV.db.doc('bsync/' + code + '_g').delete(); } catch (e) { /* 沒有舊資料就算了 */ }
    await ENV.db.doc('battles/' + code).set({ code, pub: PUB, seed, dur, qm: normQm(qm), status: 'waiting', host: { name: clamp(name, 12), av: S.av }, guest: null, startAt: null, at: Date.now() });
    ROOM = { code, slot: 'h', av: S.av, name: clamp(name, 12), dur, seed, qm: normQm(qm), room: null, started: false };
    subscribeRoom(); S.view = 'lobby'; render();
  } catch (e) { S.err = '建立房間失敗，請再試一次'; render(); }
}

    if (!snap.exists) { S.err = '找不到這個代碼，請看房主平板上的 4 位數'; return render(); }
    const d = snap.data();
    if (d.pub !== PUB) { S.err = '這是' + (MF.PUBS[d.pub] ? MF.PUBS[d.pub].name : '別的版本') + '的房間'; return render(); }
    if (d.status !== 'waiting' || d.guest) { S.err = '這個房間已經有人加入或已開始'; return render(); }
    await ref.update({ guest: { name: clamp(name, 12), av: S.av }, status: 'ready' });
    ROOM = { code, slot: 'g', av: S.av, name: clamp(name, 12), dur: d.dur, seed: d.seed, qm: normQm(d.qm), room: null, started: false };
    subscribeRoom(); S.view = 'lobby'; render();

      h('div', { class: 'brow' }, h('span', {}, '準確率 ', h('b', { class: 'inl' }, a == null ? '—' : a + '%')), h('span', {}, c + '/' + n + ' 題對')),
      h('div', { class: 'brow' }, h('span', {}, '最高連對 ' + (ms == null ? '—' : ms)), h('span', {}, '搶先 ' + (fs == null ? '—' : fs) + ' 次')),
      bGod(c, n) ? h('div', { class: 'pill ok', style: 'margin-top:6px' }, '🎯 神準（準確率 90% 以上）') : null);
  };
  return h('div', { class: 'stats bstats' }, mk(avName(r), true, r.score, myC, myN, p.maxStreak, G && G.b ? G.b.fs : 0, r.out === 'win'),
    mk(avName({ name: r.oppName, av: r.oppAv }), false, r.oppScore, r.oppC, r.oppN, r.oppMs, r.oppFs, r.out === 'lose'));
}
function bTieNote(r) {
  if (r.tie !== 'acc' && r.tie !== 'streak') return null;
  const a = bAcc(r.items.filter(i => i.ok).length, r.items.length), o = bAcc(r.oppC, r.oppN);
  return h('div', { class: 'note', style: 'margin-bottom:8px' }, r.tie === 'acc' ? '分數一樣！比準確率：你 ' + a + '%　對手 ' + o + '%。' : '分數和準確率都一樣，比最高連對。');
}


/* =========================================================
   老師試玩模式（只有老師後台進得來）
   老師自己把遊戲從頭玩一遍：成績不存、即時狀況不寫、不留續玩紀錄，排行榜也不會出現。
   玩的時候左下角有試玩工具：指定骰子、直接答對／答錯、換題、直接走到某種格子、剩幾秒、立刻結算、看題庫答案。
   ========================================================= */
const TT_TILES = [['C', '機會格'], ['H', '挑戰格'], ['B', '加分格'], ['P', '扣分格'], ['A', '前進格'], ['S', '起點']];
function ttCard() {
  const qm = h('select', { class: 'text', id: 'tt-qm', 'aria-label': '試玩的題型', style: 'width:auto;min-height:40px;padding:4px 10px' }, ['m', 'j', 'c'].map(k => h('option', { value: k, selected: k === S.qm }, QM_NAME[k])));
  return h('div', { class: 'card', id: 'tt-card', style: 'margin-bottom:14px;border:2px solid var(--warn)' },
    h('b', {}, '🧪 老師試玩模式'),
    h('p', { class: 'small muted', style: 'margin:4px 0 10px' }, '你自己從頭玩一遍，看看題目和流程。試玩的局不會存成績，也不會出現在即時狀況和排行榜。玩的時候左下角有「🧪 試玩工具」：指定骰子點數、直接答對或答錯、換一題、直接走到機會格或挑戰格、把時間調到剩幾秒、立刻結算、看題庫答案。'),
    h('div', { class: 'row' }, h('label', { class: 'small muted', for: 'tt-qm' }, '題型'), qm,
      h('button', { class: 'btn sm', id: 'tt-solo', onclick: () => ttStart('solo', qm.value) }, '試玩單人大富翁'),
      h('button', { class: 'btn sm ghost', id: 'tt-bank', onclick: () => qbOpen() }, '📚 看題庫（含答案）')),
    h('div', { class: 'row', style: 'margin-top:8px' }, h('span', { class: 'small muted' }, '小遊戲：'), Object.keys(AR_GAMES).map(k => h('button', { class: 'btn sm ghost', id: 'tt-ar-' + k, onclick: () => ttStart(k) }, '試玩' + AR_GAMES[k]))),
    h('p', { class: 'small muted', style: 'margin:8px 0 0' }, '雙人對戰要兩台平板同時連線，沒辦法一個人試玩；要測就用兩台開「建立對戰房間」（那兩局會照常記錄，玩完可以在下面學生一覽刪掉）。'));
}
function ttStart(kind, qm) {
  TEST = true; TT.die = 0; TT.open = false; S.tab = 'student'; S.pinOpen = false; qbClose();
  const nm = '老師試玩';
  if (kind === 'solo') { lockForGame(); RES = null; ROOM = null; stopArcade(); newGame('solo', nm, newSeed(), DUR_SOLO, Date.now(), qm); S.view = 'game'; render(); }
  else startArcade(kind, nm);
}
function ttEnd() {
  clearInterval(timerId); clearTimeout(RES && RES.chk); stopArcade(); SND.stopMusic(); qbClose();
  if (G) G.over = true;
  G = null; RES = null; TEST = false; TT.die = 0; TT.open = false; S.view = 'start'; S.tab = teacherOn() ? 'teacher' : 'student'; render();
}
function ttPaint() {
  let bar = $('tt-bar');
  if (!TEST) { if (bar) bar.remove(); return; }
  if (!bar) { bar = h('div', { class: 'tt-bar', id: 'tt-bar' }); document.body.appendChild(bar); }
  bar.textContent = '';
  bar.appendChild(h('button', { class: 'tt-tog', id: 'tt-tog', 'aria-expanded': TT.open, onclick: () => { TT.open = !TT.open; ttPaint(); } }, TT.open ? '🧪 收起試玩工具' : '🧪 試玩工具'));
  if (TT.open) bar.appendChild(h('div', { class: 'tt-body', role: 'group', 'aria-label': '試玩工具' }, ttTools()));
}
function ttTools() {
  const out = [];
  const btn = (lab, fn, id, ghost) => h('button', { class: 'btn sm' + (ghost ? ' ghost' : ''), id, onclick: fn }, lab);
  const sec = (title, kids) => [h('h4', {}, title), h('div', { class: 'tt-row' }, kids)];
  if (S.view === 'game' && G && !G.over) {
    const die = h('select', { id: 'tt-die', 'aria-label': '骰子點數', onchange: e => { TT.die = Number(e.target.value) || 0; } }, [0, 1, 2, 3, 4, 5, 6].map(n => h('option', { value: n, selected: TT.die === n }, n ? n + ' 點' : '隨機')));
    const tile = h('select', { id: 'tt-tile', 'aria-label': '要走到哪一種格子' }, TT_TILES.map(t => h('option', { value: t[0] }, t[1])));
    out.push(sec('這一題', [btn('✔ 直接答對', () => ttAnswer(true), 'tt-ok'), btn('✘ 直接答錯', () => ttAnswer(false), 'tt-ng'), btn('換一題', ttSkip, 'tt-skip', true)]));
    out.push(sec('骰子（選了之後每次都擲這個點數）', [die]));
    out.push(sec('直接走到下一個…（答對、可以擲骰子的時候用）', [tile, btn('走過去', () => ttGoto(tile.value), 'tt-go')]));
    out.push(sec('時間', [btn('剩 65 秒', () => ttTime(65000), 'tt-t65', true), btn('剩 15 秒', () => ttTime(15000), 'tt-t15', true), btn('立刻結算', ttFinish, 'tt-fin')]));
  } else if (S.view === 'arcade' && A && !A.over) {
    out.push(sec('這一題', [btn('✔ 直接答對', () => ttAnswer(true), 'tt-ok'), btn('✘ 直接答錯', () => ttAnswer(false), 'tt-ng')]));
    out.push(sec('時間', [btn('剩 65 秒', () => ttTime(65000), 'tt-t65', true), btn('剩 15 秒', () => ttTime(15000), 'tt-t15', true), btn('立刻結算', ttFinish, 'tt-fin')]));
  } else if (S.view === 'result') {
    out.push(h('p', { class: 'small muted', style: 'margin:6px 0 0' }, '這局是試玩，成績沒有存。按「回首頁」或下面的「結束試玩」回到老師後台。'));
  }
  out.push(sec('其他', [btn('📚 看題庫', () => qbOpen(), 'tt-qb', true), btn('結束試玩，回後台', ttEnd, 'tt-end', true)]));
  return out;
}
const ttNum = x => String(Number(Number(x).toFixed(6)));
function ttAnswer(ok) {
  if (S.view === 'arcade' && A) {
    if (A.over || A.phase !== 'play') { bPop('等下一題出來再按', 'bad'); return; }
    const r = A.r;
    if (ok) r.good.slice().forEach(i => arcPick(i));
    else { const w = r.labels.findIndex((_, i) => r.good.indexOf(i) < 0); if (w >= 0) arcPick(w); else arcResolve(false, false); }
    return;
  }
  if (!G || G.over) return;
  if (G.phase !== 'q') { bPop(G.phase === 'roll' ? '已經答對了，請擲骰子或用「走過去」' : '現在不是作答的時候', 'bad'); return; }
  const q = G.q;
  if (q.kind === 's') G.picks = ok ? q.ans.slice() : [q.items.findIndex((_, i) => q.ans.indexOf(i) < 0)];
  else if (q.kind === 'c') { const a = q.ans; G.inp = calcInit(); if (a.t === 'frac') { G.inp.n = String(ok ? a.n : a.n + 1); G.inp.d = String(a.d); } else G.inp.s = ttNum(ok ? a.v : a.v + 1); }
  else G.sel = ok ? q.ans : q.opts.map((_, i) => i).filter(i => i !== q.ans && G.gone.indexOf(i) < 0)[0];
  confirmAnswer();
}
function ttSkip() {
  if (!G || G.over || G.phase !== 'q') { bPop('作答的時候才能換題', 'bad'); return; }
  G.log = [];
  if (G.chalQ) { const q = G.chal[chalKindAt(G.chalN)].next({ tier: 'M' }); G.chalN++; setQ(q, true); }
  else setQ(G.main[kindAt(G.turn)].next({ turn: G.turn }), false);
  bPop('換了一題（不計分）', 'good');
}
async function ttGoto(t) {
  if (!G || G.over) return;
  if (G.phase === 'q') { bPop('先答完這題（可以按「直接答對」）', 'bad'); return; }
  if (G.phase !== 'roll') { bPop('答對、出現「擲骰子」的時候才能用', 'bad'); return; }
  let d = 1; while (d < N && LAYOUT[(G.steps + d) % N] !== t) d++;
  const nm = (TT_TILES.find(x => x[0] === t) || ['', '那一格'])[1];
  G.phase = 'move'; updateHud(); const p = $('panel'); if (p) { p.textContent = ''; p.appendChild(h('p', { class: 'muted', role: 'status' }, '移動中…')); }
  ensureVisible($('board'));
  G.log = G.log.filter(l => l.d); G.log.push({ t: '試玩：直接走 ' + d + ' 格到' + nm, d: 0 });
  await moveSteps(d, 1); if (!G || G.over) return;
  await land();
}
function ttTime(ms) {
  if (S.view === 'arcade' && A && !A.over) { A.t0 = Date.now() + ms - A.dur; A.w60 = false; A.lastSec = 99; return; }
  if (G && !G.over) { G.t0 = Date.now() + ms - G.dur; G.w60 = false; G.lastSec = 99; tick(); }
}
function ttFinish() { if (S.view === 'arcade' && A && !A.over) finishArcade(); else if (G && !G.over) finish(); }

/* ---- 題庫瀏覽：每一種題目各出一題，附正確答案和說明 ---- */
const QB = { u: null, k: 'j', seed: 1 };
function qbOpen() { if (!QB.u || !PI.units.some(u => u.id === QB.u)) QB.u = PI.units[0].id; QB.seed = newSeed(); qbPaint(); }
function qbClose() { const o = $('qb-ov'); if (o) o.remove(); }
function qbGens() {
  const L = QB.k === 'c' ? MF.CGEN : MF.GEN.filter(g => (QB.k === 's') === (g.kind === 's'));
  return L.filter(g => g.units.indexOf(QB.u) >= 0 && g.pubs.indexOf(PUB) >= 0);
}
function qbItem(g, r) {
  let q; try { q = MF.build(g, r, PUB); } catch (e) { return null; }
  const ans = q.kind === 's' ? selChips(q, q.ans)
    : q.kind === 'c' ? h('div', { class: 'cmp' }, h('div', { class: 'cell right' }, h('span', { class: 'lab' }, '正確答案'), h('b', {}, rich(MF.ansText(q.ans)))))
    : h('div', { class: 'opts' }, optionEls(q, { choice: -1, first: -1 }));
  return h('div', { class: 'qb-item' },
    h('div', { class: 'row', style: 'gap:6px' }, h('span', { class: 'pill' }, TIER[q.t] || ''), q.tag ? h('span', { class: 'pill' }, '課本 ' + q.tag) : null, h('b', { class: 'small' }, g.skill)),
    stemEl(q.stem, true), ans,
    h('p', { class: 'qb-why' }, h('b', {}, q.kind === 'c' ? '算式：' : '說明：'), rich(q.why)));
}
function qbPaint() {
  let ov = $('qb-ov');
  if (!ov) { ov = h('div', { class: 'qb-ov', id: 'qb-ov' }); ov.addEventListener('click', e => { if (e.target === ov) qbClose(); }); document.body.appendChild(ov); }
  ov.textContent = ''; ov.scrollTop = 0;
  const gens = qbGens(), r = MF.mkrng(QB.seed);
  const items = gens.map(g => qbItem(g, r)).filter(Boolean);
  const kinds = [['j', '判斷題'], ['c', '計算題'], ['s', '勾選題']];
  ov.appendChild(h('div', { class: 'qb', role: 'dialog', 'aria-modal': 'true', 'aria-label': '題庫' },
    h('div', { class: 'qb-head' }, h('h2', { style: 'font-size:20px' }, '📚 題庫（' + PI.name + '）'),
      h('div', { class: 'row' }, h('button', { class: 'btn sm ghost', id: 'qb-re', onclick: () => { QB.seed = newSeed(); qbPaint(); } }, '換一組數字'), h('button', { class: 'btn sm', id: 'qb-x', onclick: qbClose }, '關閉'))),
    h('p', { class: 'small muted', style: 'margin:4px 0 0' }, '每一種題目各出一題（數字是隨機的），綠色是正確答案，黃色螢光筆是題目裡的線索。'),
    h('div', { class: 'tabs', role: 'group', 'aria-label': '單元' }, PI.units.map(u => h('button', { class: 'tab', 'aria-pressed': QB.u === u.id, onclick: () => { QB.u = u.id; qbPaint(); } }, u.n + '. ' + u.name))),
    h('div', { class: 'tabs', role: 'group', 'aria-label': '題型' }, kinds.map(k => h('button', { class: 'tab', 'aria-pressed': QB.k === k[0], onclick: () => { QB.k = k[0]; qbPaint(); } }, k[1]))),
    h('p', { class: 'small', style: 'margin:10px 0 0' }, items.length ? '共 ' + items.length + ' 種' : '這個單元沒有' + (kinds.find(k => k[0] === QB.k) || ['', ''])[1] + '。'),
    items));
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('qb-ov')) qbClose(); });


/* ---------- 啟動 ---------- */
document.addEventListener('pointerdown', () => SND.unlock(), { passive: true });
document.addEventListener('keydown', onHwKey);
render();
(async function boot() {
  try {
    if (!window.BR || !window.BR.use) return;
    const user = await BR.use('user');
    if (user && (await user.isOwner())) {
      ENV.owner = true; ENV.db = await BR.use('db');
      if (!ENV.db) { ENV.owner = false; return; }
      try { const snap = await ENV.db.collection('settings').doc('pin').get(); const d = snap.exists ? snap.data() : null; ENV.pin = d && d.hash ? { salt: String(d.salt || ''), hash: String(d.hash) } : null; } catch (e) { ENV.pin = null; }
      ENV.pinLoaded = true; ENV.unlocked = false;
      if (S.view === 'start' || S.view === 'result') render(); else renderTop();
      subscribeLB();
    }
  } catch (e) { /* 沒有老師功能，維持學生模式 */ }
})();
window.__MF_APP = { S, ENV, LB, T, LIVE, SND, encodeCode, decodeCode, sanitize, lbOf, get G() { return G; }, get RES() { return RES; }, get ROOM() { return ROOM; }, get A() { return A; }, PAD, startArcade, arcPick, arcNext, AR_GAMES, get TEST() { return TEST; }, TT, ttStart, ttEnd, qbOpen };
})();
